id: hikvision-ip-camera
info:
  name: 海康威视摄像头
  author: archer
  verified: true
  description: 检测到海康威视摄像头系统或组件的特征
  created: 2025/04/16
  product:
    id: hikvision.ip-camera
    name: 海康威视网络摄像机
    vendor: 海康威视
    category: device
    identity: product
    assurance: inferred
    tags:
      - camera
    aliases:
      - 海康威视摄像头
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Common/static/theme/theme.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-383452067"
  r2:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "999357577"
expression: r0() || r1() || r2()
