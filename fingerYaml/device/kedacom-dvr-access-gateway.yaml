id: kedacom-dvr-access-gateway
info:
  name: kedacom-dvr接入网关
  author: archer
  verified: false
  description: 检测到kedacom-dvr接入网关系统或组件的特征
  created: 2025/04/24
  product:
    id: kedacom.dvr-access-gateway
    name: DVR 接入网关
    vendor: 科达
    category: device
    identity: product
    assurance: inferred
    tags:
      - camera
      - gateway
    aliases:
      - kedacom-dvr接入网关
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"苏州科达科技有限公司") && response.body.ibcontains(b"src='images/ind_log_kedacom.png')")
expression: r0()
