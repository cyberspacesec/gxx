  name: lenovo-thinkserver
  author: archer
  verified: false
  description: 检测到lenovo-thinkserver系统或组件的特征
  created: 2025/04/24
  product:
    id: lenovo.thinkserver
    name: ThinkServer
    vendor: 联想
    category: device
    identity: product
    assurance: inferred
