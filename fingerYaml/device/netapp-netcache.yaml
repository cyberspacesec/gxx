id: netapp-netcache
info:
  name: netapp-netcache-appliance
  author: archer
  verified: false
  description: 检测到netapp-netcache-appliance系统或组件的特征
  created: 2025/04/24
  product:
    id: netapp.netcache
    name: NetApp NetCache
    vendor: NetApp
    category: device
    identity: product
    assurance: inferred
    tags:
      - proxy
    aliases:
      - NetCache Appliance
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: netcache appliance")'
expression: r0()
