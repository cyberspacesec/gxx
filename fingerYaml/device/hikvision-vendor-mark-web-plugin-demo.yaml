id: hikvision-vendor-mark-web-plugin-demo
info:
  name: hikvision-v23-control
  author: archer
  verified: false
  description: 检测到hikvision-v23-control系统或组件的特征
  created: 2025/04/24
  product:
    id: hikvision.vendor-mark
    name: 海康威视厂商标识
    vendor: 海康威视
    category: device
    identity: signal
    assurance: inferred
    tags:
      - camera
      - nvr
      - default-page
    aliases:
      - 海康威视网络设备
      - 海康威视 Web 控件演示页
      - hikvision-v23-control
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"hikvision v2.3控件网页demo")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"杭州海康威视数字技术股份有限公司")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"if(m_bdvrcontrol.stoptalk())")
expression: r0() || r1() || r2()
