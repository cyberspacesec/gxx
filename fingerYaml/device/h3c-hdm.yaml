id: h3c-hdm
info:
  name: h3c-hdm
  author: archer
  verified: false
  description: 检测到h3c-hdm系统或组件的特征
  created: 2025/04/24
  product:
    id: h3c.hdm
    name: H3C HDM
    vendor: 新华三
    category: device
    identity: product
    assurance: inferred
    tags:
      - remote-access
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/video_record.jnlp")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<iframe frameborder=\"0\" class=\"framelayout\" src=\"./page/blank.html\" name=\"mainframe\" id=\"mainframe")
expression: r0() || r1()
