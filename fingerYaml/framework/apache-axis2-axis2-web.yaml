id: apache-axis2-axis2-web
info:
  name: axis2-web
  author: archer
  verified: false
  description: 检测到axis2-web系统或组件的特征
  created: 2025/04/24
  product:
    id: apache.axis2
    name: Apache Axis2
    vendor: Apache Software Foundation
    category: framework
    identity: product
    assurance: verified
    tags:
      - framework
    aliases:
      - apache-axis2
    references:
      - https://axis.apache.org/axis2/java/core/
    description: SOAP 和 Web 服务的实现框架。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"axis2-web/css/axis-style.css")
expression: r0()
