id: apache-shiro
info:
  tags: framework
  reference:
    - https://shiro.apache.org/
  name: apache-shiro
  author: archer
  verified: false
  description: 提供身份认证、授权与会话管理的 Java 安全框架。
  created: 2025/04/24
  product:
    id: apache.shiro
    name: Apache Shiro
    vendor: Apache Software Foundation
    category: framework
    identity: product
    assurance: verified
    tags:
      - framework
      - dev-framework
    aliases:
      - apache-shiro
    references:
      - https://shiro.apache.org/
    description: 提供身份认证、授权与会话管理的 Java 安全框架。
rules:
  r0:
    request:
      method: POST
      path: /
      headers:
        Cookie: rememberMe=admin;rememberMe-K=admin
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: rememberMe")'
  r1:
    request:
      method: GET
      path: /
      headers:
        Cookie: rememberMe=admin;rememberMe-K=admin
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: rememberMe")'
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"</i> shiro</li>")
expression: r0() || r1() || r2()
