id: laravel
info:
  name: laravel-framework
  author: archer
  verified: false
  description: 检测到laravel-framework系统或组件的特征
  created: 2025/04/24
  product:
    id: laravel.laravel
    name: Laravel
    category: framework
    identity: product
    assurance: verified
    tags:
      - dev-framework
    aliases:
      - laravel-framework
    references:
      - https://laravel.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: laravel_session")'
expression: r0()
