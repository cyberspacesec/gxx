id: neusoft-unieap
info:
  name: neusoft-uniportal
  author: archer
  verified: false
  description: 检测到neusoft-uniportal系统或组件的特征
  created: 2025/04/24
  product:
    id: neusoft.unieap
    name: UniEAP
    vendor: 东软
    category: framework
    identity: product
    assurance: inferred
    tags:
      - dev-framework
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ecdomain/unieap/ria/unieap/themes/earth/common/unieap.css")
expression: r0()
