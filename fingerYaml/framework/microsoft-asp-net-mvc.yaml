id: microsoft-asp-net-mvc
info:
  name: aspnet-mvc
  author: archer
  verified: false
  description: 检测到aspnet-mvc系统或组件的特征
  created: 2025/04/24
  product:
    id: microsoft.asp-net-mvc
    name: ASP.NET MVC
    vendor: Microsoft
    category: framework
    identity: signal
    assurance: inferred
    tags:
      - dev-framework
      - default-page
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<h2>modify this template to jump-start your asp.net mvc application.</h2>")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"asp.net mvc application</p>")
expression: r0() || r1()
