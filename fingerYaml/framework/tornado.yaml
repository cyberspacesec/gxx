id: tornado
info:
  name: tornadoserver
  author: archer
  verified: false
  description: 检测到tornadoserver系统或组件的特征
  created: 2025/04/24
  product:
    id: tornado.tornado
    name: Tornado
    category: framework
    identity: product
    assurance: verified
    tags:
      - dev-framework
    aliases:
      - TornadoServer
    references:
      - https://www.tornadoweb.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: tornadoserver")'
expression: r0()
