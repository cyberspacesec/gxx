id: cpanel
info:
  name: cpanel
  author: archer
  verified: false
  description: 检测到cpanel系统或组件的特征
  created: 2025/04/24
  product:
    id: cpanel.cpanel
    name: cPanel
    vendor: cPanel
    category: hosting-panel
    identity: product
    assurance: verified
    references:
      - https://cpanel.net/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"cpanel_magic_revision") && response.body.ibcontains(b"go.cpanel.net")
expression: r0()
