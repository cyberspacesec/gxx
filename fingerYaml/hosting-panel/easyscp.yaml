id: easyscp
info:
  name: easyscp
  author: archer
  verified: false
  description: 检测到easyscp系统或组件的特征
  created: 2025/04/24
  product:
    id: easyscp.easyscp
    name: EasySCP
    category: hosting-panel
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/css/easyscp.login.css") && response.body.ibcontains(b"content='easyscp")
expression: r0()
