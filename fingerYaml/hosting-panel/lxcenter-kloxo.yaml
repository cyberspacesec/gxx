id: lxcenter-kloxo
info:
  name: kloxo-single-server
  author: archer
  verified: false
  description: 检测到kloxo-single-server系统或组件的特征
  created: 2025/04/24
  product:
    id: lxcenter.kloxo
    name: Kloxo
    vendor: LxCenter
    category: hosting-panel
    identity: product
    assurance: inferred
    aliases:
      - kloxo-single-server
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/img/hypervm-logo.gif")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/htmllib/js/preop.js")
expression: r0() || r1()
