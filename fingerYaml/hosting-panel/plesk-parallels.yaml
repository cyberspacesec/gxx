id: plesk-parallels
info:
  name: parallels-plesk-panel
  author: archer
  verified: false
  description: 检测到parallels-plesk-panel系统或组件的特征
  created: 2025/04/24
  product:
    id: plesk.plesk
    name: Plesk
    vendor: Plesk
    category: hosting-panel
    identity: product
    assurance: verified
    aliases:
      - Parallels Plesk Panel
      - Plesk Onyx
    references:
      - https://www.plesk.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"parallels ip holdings gmbh")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<img src=\"./img/panel-logo.png\" alt=\"parallels plesk panel\"></a>")
expression: r0() || r1()
