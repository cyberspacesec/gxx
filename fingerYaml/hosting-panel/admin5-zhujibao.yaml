id: admin5-zhujibao
info:
  name: zhu-ji-bao
  author: archer
  verified: false
  description: 检测到zhu-ji-bao系统或组件的特征
  created: 2025/04/24
  product:
    id: admin5.zhujibao
    name: 主机宝
    category: hosting-panel
    identity: product
    assurance: inferred
    tags:
      - default-page
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"您访问的是主机宝服务器默认页")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href=\"http://z.admin5.com/\" target=")
expression: r0() || r1()
