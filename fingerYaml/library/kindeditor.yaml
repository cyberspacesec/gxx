id: kindeditor
info:
  name: kindeditor
  author: archer
  verified: false
  description: 检测到kindeditor系统或组件的特征
  created: 2025/04/24
  product:
    id: kindeditor.kindeditor
    name: KindEditor
    category: library
    identity: signal
    assurance: inferred
    tags:
      - js-library
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"kindeditor.js")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"kindeditor.ready")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"kindeditor-min.js")
expression: r0() || r1() || r2()
