id: smartbear-swagger-ui
info:
  name: swagger
  author: archer
  verified: false
  description: 检测到swagger系统或组件的特征
  created: 2025/04/24
  product:
    id: smartbear.swagger-ui
    name: Swagger UI
    vendor: SmartBear
    category: library
    identity: product
    assurance: verified
    aliases:
      - Swagger
    references:
      - https://github.com/swagger-api/swagger-ui
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Swagger UI")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"swagger-ui.css")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"swagger-ui.js")
expression: r0() || r1() || r2()
