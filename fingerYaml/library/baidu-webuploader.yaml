id: baidu-webuploader
info:
  name: webuploader
  author: archer
  verified: false
  description: 检测到webuploader系统或组件的特征
  created: 2025/04/24
  product:
    id: baidu.webuploader
    name: WebUploader
    vendor: 百度
    category: library
    identity: product
    assurance: verified
    tags:
      - js-library
    references:
      - https://github.com/fex-team/webuploader
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/webuploader.min.js\"></script>")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/webuploader.js\"></script>")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/webuploader.css\" rel=\"stylesheet")
expression: r0() || r1() || r2()
