id: baidu-ueditor
info:
  name: ueditor
  author: archer
  verified: false
  description: 检测到ueditor系统或组件的特征
  created: 2025/04/24
  product:
    id: baidu.ueditor
    name: UEditor
    vendor: 百度
    category: library
    identity: product
    assurance: verified
    tags:
      - js-library
    references:
      - https://github.com/fex-team/ueditor
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"ueditor.all.js")
expression: r0()
