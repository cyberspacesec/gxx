id: neo4j-browser
info:
  name: neo4j-browser
  author: archer
  verified: false
  description: 检测到neo4j-browser系统或组件的特征
  created: 2025/04/24
  product:
    id: neo4j.neo4j
    name: Neo4j
    vendor: Neo4j, Inc.
    category: database
    identity: product
    assurance: verified
    tags:
      - graph-db
    aliases:
      - Neo4j Browser
    references:
      - https://neo4j.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"neo4j://") && response.body.ibcontains(b"neo4j_version") && response.body.ibcontains(b"neo4j_edition")
expression: r0()
