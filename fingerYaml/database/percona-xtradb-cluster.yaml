id: percona-xtradb-cluster
info:
  name: percona-xtradb-cluster
  author: archer
  verified: false
  description: 检测到percona-xtradb-cluster系统或组件的特征
  created: 2025/04/24
  product:
    id: percona.xtradb-cluster
    name: Percona XtraDB Cluster
    vendor: Percona
    category: database
    identity: product
    assurance: inferred
    aliases:
      - PXC
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"percona xtradb cluster node")
expression: r0()
