id: apache-http-server
info:
  tags: web-server
  reference:
    - https://httpd.apache.org/
  name: apache-http
  author: archer
  verified: false
  description: 提供 HTTP 服务的开源 Web 服务器。
  created: 2025/04/24
  product:
    id: apache.http-server
    name: Apache HTTP Server
    vendor: Apache Software Foundation
    category: web-server
    identity: product
    assurance: verified
    tags:
      - web-server
      - default-page
    aliases:
      - Apache
      - apache-http
      - Apache2 Ubuntu默认页面
    cpe:
      - cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
    references:
      - https://httpd.apache.org/
    description: 提供 HTTP 服务的开源 Web 服务器。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"server: Apache")'
    output:
      product_version: >-
        "(?im)^server:\\s*Apache/(?<version>[0-9]+(?:[.][0-9]+){1,3}(?:[-_][a-zA-Z0-9.]+)?)".bsubmatch(response.raw_header)["version"]
expression: r0()
