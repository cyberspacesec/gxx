id: ideawebserver
info:
  name: ideawebserver
  author: archer
  verified: false
  description: 检测到ideawebserver系统或组件的特征
  created: 2025/04/24
  product:
    id: ideawebserver.ideawebserver
    name: IdeaWebServer
    category: web-server
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: ideawebserver")'
expression: r0()
