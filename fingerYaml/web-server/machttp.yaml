id: machttp
info:
  name: machttp
  author: archer
  verified: false
  description: 检测到machttp系统或组件的特征
  created: 2025/04/24
  product:
    id: machttp.machttp
    name: MacHTTP
    category: web-server
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: machttp")'
expression: r0()
