id: windriver-web-server
info:
  name: windriver
  author: archer
  verified: false
  description: 检测到windriver系统或组件的特征
  created: 2025/04/24
  product:
    id: windriver.web-server
    name: Wind River Web Server
    vendor: Wind River
    category: web-server
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: windriver-webserver")'
expression: r0()
