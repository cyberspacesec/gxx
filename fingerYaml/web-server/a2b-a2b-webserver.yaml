id: a2b-a2b-webserver
info:
  name: a2b-webserver
  author: archer
  verified: false
  description: 检测到a2b-webserver系统或组件的特征
  created: 2025/04/24
  product:
    id: a2b.a2b-webserver
    name: a2b webserver
    category: web-server
    identity: product
    assurance: inferred
    tags:
      - web-server
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: a2b webserver")'
expression: r0()
