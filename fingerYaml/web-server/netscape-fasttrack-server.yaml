id: netscape-fasttrack-server
info:
  name: netscape-fasttrack
  author: archer
  verified: false
  description: 检测到netscape-fasttrack系统或组件的特征
  created: 2025/04/24
  product:
    id: netscape.fasttrack-server
    name: Netscape FastTrack Server
    vendor: Netscape
    category: web-server
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: netscape-fasttrack")'
expression: r0()
