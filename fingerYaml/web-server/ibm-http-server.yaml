id: ibm-http-server
info:
  name: ibm-http-server
  author: archer
  verified: false
  description: 检测到ibm-http-server系统或组件的特征
  created: 2025/04/24
  product:
    id: ibm.http-server
    name: IBM HTTP Server
    vendor: IBM
    category: web-server
    identity: product
    assurance: inferred
    aliases:
      - ibm-http-server
      - IHS
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"IBM HTTP Server") && response.body.ibcontains(b"Support")
expression: r0()
