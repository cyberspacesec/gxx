id: nginx-ubuntu-default-page
info:
  name: ubuntu
  author: archer
  verified: false
  description: 检测到ubuntu系统或组件的特征
  created: 2025/04/24
  product:
    id: nginx.nginx
    name: nginx
    category: web-server
    identity: product
    assurance: verified
    tags:
      - web-server
      - proxy
      - default-page
    aliases:
      - NGINX
    references:
      - https://nginx.org/en/
    description: 提供 HTTP 服务和反向代理的开源 Web 服务器。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"welcome to nginx on ubuntu!")
expression: r0()
