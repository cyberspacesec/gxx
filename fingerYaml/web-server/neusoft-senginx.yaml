id: neusoft-senginx
info:
  name: neusoft-senginx
  author: archer
  verified: false
  description: 检测到neusoft-senginx系统或组件的特征
  created: 2025/04/24
  product:
    id: neusoft.senginx
    name: SEnginx
    vendor: 东软
    category: web-server
    identity: product
    assurance: inferred
    tags:
      - waf
    aliases:
      - Security Enhanced Nginx
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"senginx-robot-mitigation")
expression: r0()
