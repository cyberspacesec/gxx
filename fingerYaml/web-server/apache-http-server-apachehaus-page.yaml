id: apache-http-server-apachehaus-page
info:
  name: apache-haus
  author: archer
  verified: false
  description: 检测到apache-haus系统或组件的特征
  created: 2025/04/24
  product:
    id: apache.http-server
    name: Apache HTTP Server
    vendor: Apache Software Foundation
    category: web-server
    identity: product
    assurance: verified
    tags:
      - web-server
      - default-page
    aliases:
      - Apache
      - apache-http
      - Apache2 Ubuntu默认页面
    cpe:
      - cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
    references:
      - https://httpd.apache.org/
    description: 提供 HTTP 服务的开源 Web 服务器。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/apachehaus.ico")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"copyright &copy; 2008-2017 <a href=\"http://www.apachehaus.com\">the apache haus</a>")
expression: r0() || r1()
