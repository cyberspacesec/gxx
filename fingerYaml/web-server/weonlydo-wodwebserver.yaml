id: weonlydo-wodwebserver
info:
  name: weonlydo-product
  author: archer
  verified: false
  description: 检测到weonlydo-product系统或组件的特征
  created: 2025/04/24
  product:
    id: weonlydo.wodwebserver
    name: wodWebServer
    vendor: WeOnlyDo Software
    category: web-server
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: weonlydo")'
expression: r0()
