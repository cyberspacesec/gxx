id: microsoft-iis-default-page
info:
  name: IIS默认界面
  author: archer
  verified: false
  description: 检测到IIS默认界面系统或组件的特征
  created: 2025/04/24
  product:
    id: microsoft.iis
    name: Internet Information Services (IIS)
    vendor: Microsoft
    category: web-server
    identity: product
    assurance: verified
    tags:
      - default-page
    aliases:
      - IIS
      - IIS默认界面
    references:
      - https://www.iis.net/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"http://go.microsoft.com/fwlink/?linkid=66138") && response.body.ibcontains(b"IIS7")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"http://go.microsoft.com/fwlink/?linkid=66138") && response.body.ibcontains(b"<title>IIS Windows Server")
expression: r0() || r1()
