id: apache-http-server-ubuntu-default-page
info:
  tags: web-server
  reference:
    - https://httpd.apache.org/
  name: apache2-ubuntu默认页面
  author: archer
  verified: false
  description: 提供 HTTP 服务的开源 Web 服务器。
  created: 2025/04/24
  product:
    id: apache.http-server
    name: Apache HTTP Server
    vendor: Apache Software Foundation
    category: web-server
    identity: product
    assurance: verified
    tags:
      - web-server
      - default-page
    aliases:
      - Apache
      - apache-http
      - Apache2 Ubuntu默认页面
    cpe:
      - cpe:2.3:a:apache:http_server:*:*:*:*:*:*:*:*
    references:
      - https://httpd.apache.org/
    description: 提供 HTTP 服务的开源 Web 服务器。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Apache2 Ubuntu Default Page") && response.body.ibcontains(b"ubuntu-logo.png")
expression: r0()
