id: dynaweb-httpd
info:
  name: dynaweb-httpd
  author: archer
  verified: false
  description: 检测到dynaweb-httpd系统或组件的特征
  created: 2025/04/24
  product:
    id: dynaweb.httpd
    name: DynaWeb httpd
    category: web-server
    identity: product
    assurance: inferred
    aliases:
      - dwhttpd
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: dwhttpd")'
expression: r0()
