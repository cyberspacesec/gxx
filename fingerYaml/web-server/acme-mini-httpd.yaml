id: acme-mini-httpd
info:
  name: mini-httpd
  author: archer
  verified: false
  description: 检测到mini-httpd系统或组件的特征
  created: 2025/04/24
  product:
    id: acme.mini-httpd
    name: mini_httpd
    category: web-server
    identity: product
    assurance: verified
    references:
      - https://acme.com/software/mini_httpd/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: mini_httpd")'
expression: r0()
