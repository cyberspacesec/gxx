id: netapp-ontap
info:
  name: netapp-data-ontap
  author: archer
  verified: false
  description: 检测到netapp-data-ontap系统或组件的特征
  created: 2025/04/24
  product:
    id: netapp.ontap
    name: NetApp ONTAP
    vendor: NetApp
    category: operating-system
    identity: product
    assurance: inferred
    tags:
      - storage
    aliases:
      - Data ONTAP
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: data ontap")'
expression: r0()
