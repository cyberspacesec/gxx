id: microsoft-windows-small-business-server
info:
  name: windows-business-server
  author: archer
  verified: false
  description: 检测到windows-business-server系统或组件的特征
  created: 2025/04/24
  product:
    id: microsoft.windows-small-business-server
    name: Windows Small Business Server
    vendor: Microsoft
    category: operating-system
    identity: product
    assurance: inferred
    aliases:
      - SBS
      - Remote Web Workplace
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"images/sbslogo.gif")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/remote\">remote web workplace")
expression: r0() || r1()
