id: opentext-open-enterprise-server
info:
  name: novell-open-enterprise-server
  author: archer
  verified: false
  description: 检测到novell-open-enterprise-server系统或组件的特征
  created: 2025/04/24
  product:
    id: opentext.open-enterprise-server
    name: Open Enterprise Server
    vendor: OpenText
    category: operating-system
    identity: product
    assurance: inferred
    tags:
      - storage
    aliases:
      - Novell Open Enterprise Server
      - Micro Focus Open Enterprise Server
      - Novell OES
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<!-- this is all just a super-duper redirect to the welcome page")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"http://www.novell.com/products/openenterpriseserver")
expression: r0() || r1()
