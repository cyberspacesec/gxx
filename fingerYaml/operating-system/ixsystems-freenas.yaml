id: ixsystems-freenas
info:
  name: freenas
  author: archer
  verified: false
  description: 检测到freenas系统或组件的特征
  created: 2025/04/24
  product:
    id: ixsystems.freenas
    name: FreeNAS
    vendor: iXsystems
    category: operating-system
    identity: product
    assurance: verified
    tags:
      - nas
      - storage
    aliases:
      - TrueNAS CORE
    references:
      - https://www.truenas.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"title=\"welcome to freenas")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/images/ui/freenas-logo.png")
expression: r0() || r1()
