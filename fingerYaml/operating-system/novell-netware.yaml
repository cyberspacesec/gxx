id: novell-netware
info:
  name: novell-netware
  author: archer
  verified: false
  description: 检测到novell-netware系统或组件的特征
  created: 2025/04/24
  product:
    id: novell.netware
    name: NetWare
    vendor: Novell
    category: operating-system
    identity: product
    assurance: inferred
    aliases:
      - Novell NetWare
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"code=\"nwshealth.class")
  r1:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: netware http stack")'
expression: r0() || r1()
