id: adobe-aem-login
info:
  name: adobe-experience-manager
  author: archer
  verified: false
  description: 检测到adobe-experience-manager系统或组件的特征
  created: 2025/04/24
  product:
    id: adobe.aem
    name: Adobe Experience Manager
    vendor: Adobe
    category: cms
    identity: product
    assurance: verified
    tags:
      - cms
      - login
    aliases:
      - AEM Finder
      - AEM
      - Adobe CQ5
    references:
      - https://business.adobe.com/products/experience-manager.html
    description: Adobe 提供的内容、站点与数字资产管理平台。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"tag{background:url(login/clientlib/resources/adobe-logo.png)")
expression: r0()
