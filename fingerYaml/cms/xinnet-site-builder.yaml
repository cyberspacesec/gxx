id: xinnet-site-builder
info:
  name: zizhujianzhan
  author: archer
  verified: false
  description: 检测到zizhujianzhan系统或组件的特征
  created: 2025/04/24
  product:
    id: xinnet.site-builder
    name: 新网自助建站系统
    vendor: 新网数码
    category: cms
    identity: product
    assurance: inferred
    tags:
      - cms
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"模板系统xinnet")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"msnim:chat?contact=xinnet@hotmail.com")
expression: r0() || r1()
