id: zencart-zen-cart
info:
  name: zen_cart-shopping
  author: archer
  verified: false
  description: 检测到zen_cart-shopping系统或组件的特征
  created: 2025/04/24
  product:
    id: zencart.zen-cart
    name: Zen Cart
    category: cms
    identity: product
    assurance: inferred
    tags:
      - ecommerce
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"shopping cart program by zen cart")
  r1:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: zenid=")'
expression: r0() || r1()
