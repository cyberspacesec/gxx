id: vp-asp
info:
  name: vp-asp
  author: archer
  verified: false
  description: 检测到vp-asp系统或组件的特征
  created: 2025/04/24
  product:
    id: vp-asp.vp-asp
    name: VP-ASP
    category: cms
    identity: product
    assurance: inferred
    tags:
      - ecommerce
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href=\"http://www.vpasp.com\">")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"vs350.js")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"shopdisplayproducts.asp?id=")
expression: r0() || r1() || r2()
