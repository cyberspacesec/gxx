id: sitecore
info:
  name: sitecore
  author: archer
  verified: true
  description: 检测到sitecore系统或组件的特征
  created: 2025/04/24
  product:
    id: sitecore.sitecore
    name: Sitecore Experience Platform
    vendor: Sitecore
    category: cms
    identity: product
    assurance: verified
    tags:
      - cms
    aliases:
      - Sitecore
    references:
      - https://www.sitecore.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"alt=\"Sitecore\" id=\"scLogo\" />")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"title=\"Sitecore Documentation site\">")
  r2:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "775590621"
expression: r0() || r1() || r2()
