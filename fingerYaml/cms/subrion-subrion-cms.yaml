id: subrion-subrion-cms
info:
  name: subrion-cms
  author: archer
  verified: false
  description: 检测到subrion-cms系统或组件的特征
  created: 2025/04/24
  product:
    id: subrion.subrion-cms
    name: Subrion CMS
    category: cms
    identity: product
    assurance: inferred
    tags:
      - cms
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"http://www.subrion.com")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"subrion cms")
expression: r0() || r1()
