  name: joomla
  author: archer
  verified: false
  description: 用于内容管理和站点发布的开源平台。
  created: 2025/04/24
  product:
    id: joomla.joomla
    name: Joomla
    category: cms
    identity: product
    assurance: verified
    tags:
      - cms
    aliases:
      - joomla
    references:
      - https://www.joomla.org/
    description: 用于内容管理和站点发布的开源平台。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<meta name=\"keywords\" content=\"joomla, Joomla\" />")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"joomla")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/media/system/js/core.js")
  r3:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/media/system/js/mootools-core.js")
expression: r0() || r1() || r2() || r3()
