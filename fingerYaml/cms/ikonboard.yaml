id: ikonboard
info:
  name: ikonboard
  author: archer
  verified: false
  description: 检测到ikonboard系统或组件的特征
  created: 2025/04/24
  product:
    id: ikonboard.ikonboard
    name: Ikonboard
    category: cms
    identity: product
    assurance: inferred
    tags:
      - forum
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"ikonboard")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.ikonboard.com")
expression: r0() || r1()
