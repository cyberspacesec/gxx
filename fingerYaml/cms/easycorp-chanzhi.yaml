id: easycorp-chanzhi
info:
  name: chanzhicms
  author: archer
  verified: false
  description: 检测到chanzhicms系统或组件的特征
  created: 2025/04/24
  product:
    id: easycorp.chanzhi
    name: 蝉知CMS
    vendor: 易软天创
    category: cms
    identity: product
    assurance: verified
    tags:
      - cms
    aliases:
      - chanzhiCMS
    references:
      - http://www.chanzhi.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"title='cms系统，首选蝉知cms")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"chanzhi.js")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"poweredby'><a href='http://www.chanzhi.org")
expression: r0() || r1() || r2()
