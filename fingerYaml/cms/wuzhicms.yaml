id: wuzhicms
info:
  name: wuzhicms
  author: archer
  verified: false
  description: 检测到wuzhicms系统或组件的特征
  created: 2025/04/24
  product:
    id: wuzhicms.wuzhicms
    name: 五指CMS
    category: cms
    identity: product
    assurance: inferred
    tags:
      - cms
    aliases:
      - WuzhiCMS
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<meta name=\"generator\" content=\"wuzhicms")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"wuzhicms") && response.body.ibcontains(b"powered by wuzhicms")
expression: r0() || r1()
