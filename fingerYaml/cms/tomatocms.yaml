id: tomatocms
info:
  name: tomatocms
  author: archer
  verified: false
  description: 检测到tomatocms系统或组件的特征
  created: 2025/04/24
  product:
    id: tomatocms.tomatocms
    name: TomatoCMS
    category: cms
    identity: product
    assurance: inferred
    tags:
      - cms
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"tomato.core.widget.loader.baseurl = 'http://")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href=\"http://www.tomatocms.com\" title=\"powered by tomatocms\" target=\"_blank\">")
expression: r0() || r1()
