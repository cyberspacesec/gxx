id: exponentcms-exponent-cms
info:
  name: exponent-cms
  author: archer
  verified: false
  description: 检测到exponent-cms系统或组件的特征
  created: 2025/04/24
  product:
    id: exponentcms.exponent-cms
    name: Exponent CMS
    category: cms
    identity: product
    assurance: inferred
    tags:
      - cms
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"exponent content management system")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by exponent cms")
expression: r0() || r1()
