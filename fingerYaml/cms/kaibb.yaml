id: kaibb
info:
  name: kaibb
  author: archer
  verified: false
  description: 检测到kaibb系统或组件的特征
  created: 2025/04/24
  product:
    id: kaibb.kaibb
    name: KaiBB
    category: cms
    identity: product
    assurance: inferred
    tags:
      - forum
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by kaibb")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"forum powered by kaibb")
expression: r0() || r1()
