id: emerson-xweb
info:
  name: emerson-xweb-evo
  author: archer
  verified: false
  description: 检测到emerson-xweb-evo系统或组件的特征
  created: 2025/04/24
  product:
    id: emerson.xweb
    name: Dixell XWEB
    vendor: Emerson
    category: iot
    identity: product
    assurance: inferred
    tags:
      - industrial
    aliases:
      - XWEB EVO
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"img/xweb-logo.png\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/css/images/logo_xweb_alpha.png\"")
expression: r0() || r1()
