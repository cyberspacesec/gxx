id: ibm-web-traffic-express
info:
  name: ibm-web-traffic-express-caching-proxy
  author: archer
  verified: false
  description: 检测到ibm-web-traffic-express-caching-proxy系统或组件的特征
  created: 2025/04/24
  product:
    id: ibm.web-traffic-express
    name: Web Traffic Express Caching Proxy
    vendor: IBM
    category: middleware
    identity: product
    assurance: inferred
    tags:
      - proxy
    aliases:
      - ibm-web-traffic-express-caching-proxy
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/admin-bin/webexec/wte.html")
expression: r0()
