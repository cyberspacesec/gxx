id: mesosphere-marathon
info:
  name: marathon
  author: archer
  verified: false
  description: 检测到marathon系统或组件的特征
  created: 2025/04/24
  product:
    id: mesosphere.marathon
    name: Marathon
    vendor: Mesosphere
    category: middleware
    identity: product
    assurance: verified
    tags:
      - container
    aliases:
      - Mesosphere Marathon
    references:
      - https://github.com/mesosphere/marathon
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"img/marathon-favicon.ico")
expression: r0()
