id: kong-kong-gateway
info:
  name: kong
  author: archer
  verified: false
  description: 检测到kong系统或组件的特征
  created: 2025/04/24
  product:
    id: kong.kong-gateway
    name: Kong Gateway
    vendor: Kong Inc.
    category: middleware
    identity: product
    assurance: verified
    tags:
      - api-gateway
    aliases:
      - kong
    references:
      - https://konghq.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: kong")'
  r1:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"via: kong")'
  r2:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"X-Kong-Response-Latency:")'
expression: r0() || r1() || r2()
