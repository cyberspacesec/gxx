id: apache-hadoop-httpfs
info:
  name: httpfs
  author: archer
  verified: false
  description: 检测到httpfs系统或组件的特征
  created: 2025/04/24
  product:
    id: apache.hadoop
    name: Apache Hadoop
    vendor: Apache Software Foundation
    category: middleware
    identity: product
    assurance: verified
    tags:
      - middleware
      - big-data
    aliases:
      - apache-hadoop
      - httpfs
    references:
      - https://hadoop.apache.org/
    description: 面向大规模数据的分布式存储与处理框架。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<b>httpfs service</b")
expression: r0()
