id: apache-spark-jobs-ui
info:
  name: spark-jobs
  author: archer
  verified: false
  description: 检测到spark-jobs系统或组件的特征
  created: 2025/04/24
  product:
    id: apache.spark
    name: Apache Spark
    vendor: Apache Software Foundation
    category: middleware
    identity: product
    assurance: verified
    tags:
      - big-data
    references:
      - https://spark.apache.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/jobs/job?id=")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"spark jobs")
expression: r0() || r1()
