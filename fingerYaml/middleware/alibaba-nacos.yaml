id: alibaba-nacos
info:
  name: alibaba-nacos
  author: archer
  verified: false
  description: 检测到alibaba-nacos系统或组件的特征
  created: 2025/04/24
  product:
    id: alibaba.nacos
    name: Nacos
    vendor: Alibaba
    category: middleware
    identity: product
    assurance: verified
    references:
      - https://github.com/alibaba/nacos
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>Nacos</title>")
  r1:
    request:
      method: GET
      path: /nacos/
    expression: response.body.ibcontains(b"<title>Nacos</title>")
expression: r0() || r1()
