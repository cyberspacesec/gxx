id: ctrip-apollo
info:
  name: apollo-adminservice
  author: archer
  verified: false
  description: 检测到apollo-adminservice系统或组件的特征
  created: 2025/04/24
  product:
    id: ctrip.apollo
    name: Apollo 配置中心
    vendor: 携程
    category: middleware
    identity: product
    assurance: inferred
    aliases:
      - Apollo
    references:
      - https://github.com/apolloconfig/apollo
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"apollo-adminservice") && response.raw_header.ibcontains(b"Content-Length: 19")'
expression: r0()
