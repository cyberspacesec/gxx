id: alibaba-otter
info:
  name: 阿里巴巴otter-manager
  author: archer
  verified: false
  description: 检测到阿里巴巴otter-manager系统或组件的特征
  created: 2025/04/24
  product:
    id: alibaba.otter
    name: Otter
    vendor: Alibaba
    category: middleware
    identity: product
    assurance: verified
    aliases:
      - Otter Manager
    references:
      - https://github.com/alibaba/otter
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Otter Manager") && response.body.ibcontains(b"channelList")
expression: r0()
