id: zope
info:
  name: zope
  author: archer
  verified: false
  description: 检测到zope系统或组件的特征
  created: 2025/04/24
  product:
    id: zope.zope
    name: Zope
    category: middleware
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"X-Powered-By: zope")'
expression: r0()
