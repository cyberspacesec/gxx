id: mashery
info:
  name: mashery-proxy
  author: archer
  verified: false
  description: 检测到mashery-proxy系统或组件的特征
  created: 2025/04/24
  product:
    id: mashery.mashery
    name: Mashery API Management
    category: middleware
    identity: product
    assurance: inferred
    tags:
      - api-gateway
      - proxy
    aliases:
      - TIBCO Mashery
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: mashery proxy")'
expression: r0()
