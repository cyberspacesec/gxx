id: alibaba-dts
info:
  name: dts-operation-platform
  author: archer
  verified: false
  description: 检测到dts-operation-platform系统或组件的特征
  created: 2025/04/24
  product:
    id: alibaba.dts
    name: 数据传输服务 DTS
    vendor: Alibaba
    category: application
    identity: product
    assurance: inferred
    tags:
      - cloud
    aliases:
      - alidts
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window.appname = 'alidts';")
expression: r0()
