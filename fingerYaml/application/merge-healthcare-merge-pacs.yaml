id: merge-healthcare-merge-pacs
info:
  name: ibm-merge-pacs
  author: archer
  verified: false
  description: 检测到ibm-merge-pacs系统或组件的特征
  created: 2025/04/24
  product:
    id: merge-healthcare.merge-pacs
    name: Merge PACS
    vendor: Merge Healthcare
    category: application
    identity: product
    assurance: inferred
    aliases:
      - ibm-merge-pacs
rules:
