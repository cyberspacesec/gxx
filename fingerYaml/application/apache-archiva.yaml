id: apache-archiva
info:
  tags: application
  reference:
    - https://archiva.apache.org/
  name: apache-archiva
  author: archer
  verified: false
  description: 用于构建产物存储、代理和检索的仓库管理器。
  created: 2025/04/24
  product:
    id: apache.archiva
    name: Apache Archiva
    vendor: Apache Software Foundation
    category: application
    identity: product
    assurance: verified
    tags:
      - application
      - devops
    aliases:
      - apache-archiva
    references:
      - https://archiva.apache.org/
    description: 用于构建产物存储、代理和检索的仓库管理器。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/archiva.js")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/archiva.css")
expression: r0() || r1()
