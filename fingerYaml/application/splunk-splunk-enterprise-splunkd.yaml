id: splunk-splunk-enterprise-splunkd
info:
  name: splunkd
  author: archer
  verified: false
  description: 检测到splunkd系统或组件的特征
  created: 2025/04/24
  product:
    id: splunk.splunk-enterprise
    name: Splunk Enterprise
    vendor: Splunk
    category: application
    identity: product
    assurance: verified
    tags:
      - siem
      - monitoring
    aliases:
      - Splunk
    references:
      - https://www.splunk.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.status == 200 && response.body.ibcontains(b"<title>splunkd</title>") && response.raw_header.ibcontains(b"Server: Splunkd")'
expression: r0()
