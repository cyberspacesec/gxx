id: jfrog-artifactory
info:
  name: jfrog
  author: archer
  verified: false
  description: 检测到jfrog系统或组件的特征
  created: 2025/04/24
  product:
    id: jfrog.artifactory
    name: JFrog Artifactory
    vendor: JFrog
    category: application
    identity: product
    assurance: verified
    tags:
      - devops
    aliases:
      - jfrog
      - Artifactory
    references:
      - https://jfrog.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=/ui/img/jfrog")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<meta http-equiv=\"refresh\" content=\"0;URL=/artifactory\">")
  r2:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Location: /artifactory/")'
expression: r0() || r1() || r2()
