id: codecentric-spring-boot-admin
info:
  name: spring-boot-admin
  author: archer
  verified: false
  description: 检测到spring-boot-admin系统或组件的特征
  created: 2025/04/24
  product:
    id: codecentric.spring-boot-admin
    name: Spring Boot Admin
    vendor: codecentric
    category: application
    identity: product
    assurance: verified
    tags:
      - monitoring
    references:
      - https://github.com/codecentric/spring-boot-admin
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"spring boot admin")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<img src=\"assets/img/icon-spring-boot-admin.svg")
expression: r0() || r1()
