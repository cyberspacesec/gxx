id: ktools-photostore
info:
  name: photostore
  author: archer
  verified: false
  description: 检测到photostore系统或组件的特征
  created: 2025/04/24
  product:
    id: ktools.photostore
    name: PhotoStore
    vendor: Ktools.net
    category: application
    identity: product
    assurance: inferred
    tags:
      - ecommerce
      - photo-gallery
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.ktools.net/photostore/index.php")
expression: r0()
