id: vmware-horizon
info:
  name: vmware-horizon
  author: archer
  verified: false
  description: 检测到vmware-horizon系统或组件的特征
  created: 2025/04/24
  product:
    id: vmware.horizon
    name: VMware Horizon
    vendor: VMware
    category: application
    identity: product
    assurance: inferred
    tags:
      - virtualization
      - remote-access
    aliases:
      - VMware View
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href='https://www.vmware.com/go/viewclients'")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"alt=\"vmware horizon\">")
expression: r0() || r1()
