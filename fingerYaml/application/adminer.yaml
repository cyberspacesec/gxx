id: adminer
info:
  name: adminer
  author: archer
  verified: false
  description: 检测到adminer系统或组件的特征
  created: 2025/04/24
  product:
    id: adminer.adminer
    name: Adminer
    category: application
    identity: product
    assurance: verified
    tags:
