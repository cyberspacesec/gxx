id: xwiki
info:
  name: xwiki
  author: archer
  verified: false
  description: 检测到xwiki系统或组件的特征
  created: 2025/04/24
  product:
    id: xwiki.xwiki
    name: XWiki
    vendor: XWiki SAS
    category: application
    identity: product
    assurance: inferred
