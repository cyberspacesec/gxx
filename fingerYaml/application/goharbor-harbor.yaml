id: goharbor-harbor
info:
  name: harbor
  author: archer
  verified: false
  description: 检测到harbor系统或组件的特征
  created: 2025/04/24
  product:
    id: goharbor.harbor
    name: Harbor
    category: application
    identity: product
    assurance: inferred
    tags:
      - container
      - devops
    references:
      - https://goharbor.io/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"<title>Harbor</title>")
expression: r0()
