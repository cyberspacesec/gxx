id: cloudera-cloudera-manager
info:
  name: cloudera-manager
  author: archer
  verified: false
  description: 检测到cloudera-manager系统或组件的特征
  created: 2025/04/24
  product:
    id: cloudera.cloudera-manager
    name: Cloudera Manager
    vendor: Cloudera
    category: application
    identity: product
    assurance: verified
    tags:
      - big-data
    references:
      - https://www.cloudera.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: cloudera_manager_sessionid=")'
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var loginpageurl = \"/cmf/login\";")
expression: r0() || r1()
