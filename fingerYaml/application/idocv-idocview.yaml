id: idocv-idocview
info:
  name: I Doc View在线文档预览系统
  author: archer
  verified: false
  description: 检测到I Doc View在线文档预览系统系统或组件的特征
  created: 2025/04/24
  product:
    id: idocv.idocview
    name: I Doc View 在线文档预览
    category: application
    identity: product
    assurance: inferred
    aliases:
      - IDocView在线文档预览系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"I Doc View") && response.body.ibcontains(b"idocv.com")
expression: r0()
