id: ibm-spectrum-computing
info:
  name: ibm-spectrum-computing
  author: archer
  verified: false
  description: 检测到ibm-spectrum-computing系统或组件的特征
  created: 2025/04/24
  product:
    id: ibm.spectrum-computing
    name: IBM Spectrum Computing
    vendor: IBM
    category: application
    identity: product
    assurance: inferred
    aliases:
      - ibm-spectrum-computing
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/platform/framework/logout/logout.action")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ssoclient_")
expression: r0() || r1()
