id: hims-hotel-cloud
info:
  name: hims-hotel-cloud-computing-service
  author: archer
  verified: false
  description: 检测到hims-hotel-cloud-computing-service系统或组件的特征
  created: 2025/04/24
  product:
    id: hims.hotel-cloud
    name: HIMS 酒店云计算服务
    category: application
    identity: product
    assurance: inferred
    tags:
      - cloud
    aliases:
      - hims-hotel-cloud-computing-service
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"gb_root_dir") && response.body.ibcontains(b"maincontent.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"hims酒店云计算服务")
expression: r0() || r1()
