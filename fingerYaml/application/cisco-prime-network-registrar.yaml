id: cisco-prime-network-registrar
info:
  name: cisco-prime-network-registrar
  author: archer
  verified: false
  description: 检测到cisco-prime-network-registrar系统或组件的特征
  created: 2025/04/24
  product:
    id: cisco.prime-network-registrar
    name: Cisco Prime Network Registrar
    vendor: Cisco
    category: application
    identity: product
    assurance: inferred
    tags:
      - dns
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"productname=\"network registrar")
expression: r0()
