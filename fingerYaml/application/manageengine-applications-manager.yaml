id: manageengine-applications-manager
info:
  name: manageengine-applications-manager
  author: archer
  verified: false
  description: 检测到manageengine-applications-manager系统或组件的特征
  created: 2025/04/24
  product:
    id: manageengine.applications-manager
    name: ManageEngine Applications Manager
    vendor: ManageEngine
    category: application
    identity: product
    assurance: inferred
    tags:
      - monitoring
    aliases:
      - manageengine-applications-manager
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/appmanager.js")
expression: r0()
