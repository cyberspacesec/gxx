id: bit-service
info:
  name: bit-service
  author: archer
  verified: false
  description: 检测到bit-service系统或组件的特征
  created: 2025/04/24
  product:
    id: bit-service.bit-service
    name: bit-service
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"bit-xxzs") && response.body.ibcontains(b"xmlpzs/webissue.asp")
expression: r0()
