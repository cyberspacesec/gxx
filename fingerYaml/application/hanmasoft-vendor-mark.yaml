id: hanmasoft-vendor-mark
info:
  name: hanmasoft
  author: archer
  verified: false
  description: 检测到hanmasoft系统或组件的特征
  created: 2025/04/24
  product:
    id: hanmasoft.vendor-mark
    name: 汉码软件厂商标识
    vendor: 汉码软件
    category: application
    identity: signal
    assurance: inferred
    aliases:
      - 汉码软件系统
      - hanmasoft
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"alt=\"汉码软件logo")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"汉码软件")
expression: r0() || r1()
