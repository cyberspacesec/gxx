id: cachethq-cachet
info:
  name: cachethq
  author: archer
  verified: false
  description: 检测到cachethq系统或组件的特征
  created: 2025/04/24
  product:
    id: cachethq.cachet
    name: Cachet
    category: application
    identity: product
    assurance: verified
    tags:
      - monitoring
    references:
      - https://cachethq.io/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"https://cachethq.io") && response.body.ibcontains(b"Atom")
expression: r0()
