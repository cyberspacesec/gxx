id: kerio-connect
info:
  name: kerio-connect
  author: archer
  verified: false
  description: 检测到kerio-connect系统或组件的特征
  created: 2025/04/24
  product:
    id: kerio.connect
    name: Kerio Connect
    vendor: Kerio Technologies
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - kerio-connect
      - Kerio MailServer
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: kerio connect")'
expression: r0()
