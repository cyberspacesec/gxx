id: creatsoft-corrosion-monitoring
info:
  name: creatsoft-system
  author: archer
  verified: false
  description: 检测到creatsoft-system系统或组件的特征
  created: 2025/04/24
  product:
    id: creatsoft.corrosion-monitoring
    name: Creatsoft 腐蚀监测系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - industrial
    aliases:
      - creatsoft-system
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/corrosion/charts/water-pid.jsp")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/corrosion/charts/ph.jsp\"")
expression: r0() || r1()
