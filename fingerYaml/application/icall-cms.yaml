id: icall-cms
info:
  name: icall-cms
  author: archer
  verified: false
  description: 检测到icall-cms系统或组件的特征
  created: 2025/04/24
  product:
    id: icall.cms
    name: iCall CMS
    category: application
    identity: product
    assurance: inferred
    aliases:
      - icall-cms
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var img_obj = document.getelementbyid('showing');")
expression: r0()
