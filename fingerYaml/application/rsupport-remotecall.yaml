id: rsupport-remotecall
info:
  name: rsupport-remotecall
  author: archer
  verified: false
  description: 检测到rsupport-remotecall系统或组件的特征
  created: 2025/04/24
  product:
    id: rsupport.remotecall
    name: RemoteCall
    vendor: RSUPPORT
    category: application
    identity: product
    assurance: inferred
    tags:
      - remote-access
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"http://www.remotecall.com")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"msg_abortservice")
expression: r0() || r1()
