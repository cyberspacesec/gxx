id: kedacom-movision
info:
  name: momeeting-movision
  author: archer
  verified: false
  description: 检测到momeeting-movision系统或组件的特征
  created: 2025/04/24
  product:
    id: kedacom.movision
    name: 摩云视讯
    vendor: 科达
    category: application
    identity: product
    assurance: inferred
    tags:
      - video-conference
    aliases:
      - MOMeeting
      - 科达视讯云
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"meeting movision\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"document.title=\"登录-摩云视讯\"")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<!-- 科达视讯云 摩云视讯 电信有区别 -->")
expression: r0() || r1() || r2()
