id: tianyuandike-management-platform
info:
  name: management-platform
  author: archer
  verified: false
  description: 检测到management-platform系统或组件的特征
  created: 2025/04/24
  product:
    id: tianyuandike.management-platform
    name: 天源迪科管理平台
    vendor: 天源迪科
    category: application
    identity: product
    assurance: inferred
    aliases:
      - management-platform
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"北京天源迪科信息技术有限公司")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"casloginview") && response.body.ibcontains(b"i-verfiy")
expression: r0() || r1()
