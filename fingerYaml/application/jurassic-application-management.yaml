id: jurassic-application-management
info:
  name: jurassic-application-management-system
  author: archer
  verified: false
  description: 检测到jurassic-application-management-system系统或组件的特征
  created: 2025/04/24
  product:
    id: jurassic.application-management
    name: Jurassic 应用管理系统
    category: application
    identity: product
    assurance: inferred
    aliases:
      - jurassic-application-management-system
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var _usermenusurl = '/appcenter/functions/getusermenu'")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"jurassic")
expression: r0() || r1()
