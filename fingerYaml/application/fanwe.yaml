id: fanwe
info:
  name: fanwe
  author: archer
  verified: false
  description: 检测到fanwe系统或组件的特征
  created: 2025/04/24
  product:
    id: fanwe.fanwe
    name: 方维系统
    vendor: 方维
    category: application
    identity: product
    assurance: inferred
    tags:
      - ecommerce
    aliases:
      - fanwe
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"app/tpl/fanwe_1/images/lazy_loading.gif")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"index.php?ctl=article_cate")
expression: r0() || r1()
