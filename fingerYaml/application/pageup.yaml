id: pageup
info:
  name: pageup-people
  author: archer
  verified: false
  description: 检测到pageup-people系统或组件的特征
  created: 2025/04/24
  product:
    id: pageup.pageup
    name: PageUp
    vendor: PageUp
    category: application
    identity: product
    assurance: inferred
    tags:
      - hr
    aliases:
      - PageUp People
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by pageup people")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"pageuplink\" href=\"http://www.pageuppeople.com")
expression: r0() || r1()
