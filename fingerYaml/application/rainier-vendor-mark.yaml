id: rainier-vendor-mark
info:
  name: rainier-internet-product
  author: archer
  verified: false
  description: 检测到rainier-internet-product系统或组件的特征
  created: 2025/04/24
  product:
    id: rainier.vendor-mark
    name: 润尼尔厂商标识
    vendor: 北京润尼尔网络科技有限公司
    category: application
    identity: signal
    assurance: inferred
    aliases:
      - 润尼尔网络科技产品
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href=\"http://www.rainier.net.cn\">北京润尼尔网络科技有限公司")
expression: r0()
