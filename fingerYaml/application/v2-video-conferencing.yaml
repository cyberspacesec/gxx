id: v2-video-conferencing
info:
  name: v2-video-conferencing
  author: archer
  verified: false
  description: 检测到v2-video-conferencing系统或组件的特征
  created: 2025/04/24
  product:
    id: v2.video-conferencing
    name: V2 视频会议系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - video-conference
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<frame src=\"../conference/currentconfaction.do")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"content.jsp\"")
expression: r0() || r1()
