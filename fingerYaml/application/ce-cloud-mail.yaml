id: ce-cloud-mail
info:
  name: ce-云邮
  author: archer
  verified: false
  description: 检测到ce-云邮系统或组件的特征
  created: 2025/04/24
  product:
    id: ce.cloud-mail
    name: CE云邮
    category: application
    identity: product
    assurance: inferred
    tags:
