id: infowarelab-system-management-center
info:
  name: infowarelab-system-management-center
  author: archer
  verified: false
  description: 检测到infowarelab-system-management-center系统或组件的特征
  created: 2025/04/24
  product:
    id: infowarelab.system-management-center
    name: Infowarelab 系统管理中心
    category: application
    identity: product
    assurance: inferred
    tags:
      - video-conference
    aliases:
      - infowarelab-system-management-center
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<div class=\"main_supporterbar\">") && response.body.ibcontains(b"class=\"main_loginbar")
expression: r0()
