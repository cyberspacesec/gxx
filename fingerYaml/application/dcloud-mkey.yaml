id: dcloud-mkey
info:
  name: mkey
  author: archer
  verified: false
  description: 检测到mkey系统或组件的特征
  created: 2025/04/24
  product:
    id: dcloud.mkey
    name: mKey
    vendor: 北京数字天堂信息科技有限责任公司
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"北京数字天堂信息科技有限责任公司")
expression: r0()
