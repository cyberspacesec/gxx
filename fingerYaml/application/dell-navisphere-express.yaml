id: dell-navisphere-express
info:
  name: dell-navisphere-express
  author: archer
  verified: false
  description: 检测到dell-navisphere-express系统或组件的特征
  created: 2025/04/24
  product:
    id: dell.navisphere-express
    name: Navisphere Express
    vendor: Dell
    category: application
    identity: product
    assurance: inferred
    tags:
      - storage
    aliases:
      - EMC Navisphere Express
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"parent.main.location = urlnonst + \"?nst=\" + top.menu.securitytoken")
expression: r0()
