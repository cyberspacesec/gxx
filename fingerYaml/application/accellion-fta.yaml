id: accellion-fta
info:
  name: accellion-secure-file-transfer
  author: archer
  verified: false
  description: 检测到accellion-secure-file-transfer系统或组件的特征
  created: 2025/04/24
  product:
    id: accellion.fta
    name: Accellion File Transfer Appliance
    vendor: Accellion
    category: application
    identity: product
    assurance: inferred
    tags:
      - file-transfer
    aliases:
      - Accellion FTA
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"secured by accellion")
expression: r0()
