id: goodway-integrated-mis
info:
  name: goodway-integrated-management-information-system
  author: archer
  verified: false
  description: 检测到goodway-integrated-management-information-system系统或组件的特征
  created: 2025/04/24
  product:
    id: goodway.integrated-mis
    name: 综合管理信息系统
    category: application
    identity: product
    assurance: inferred
    aliases:
      - goodway-integrated-management-information-system
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"option value=\"enterprise\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"是否域账户登录")
expression: r0() || r1()
