id: kexin-kxmail-powered-by
info:
  name: kxmail
  author: archer
  verified: false
  description: 检测到kxmail系统或组件的特征
  created: 2025/04/24
  product:
    id: kexin.kxmail
    name: KXmail 科信邮件系统
    vendor: 科信软件
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - kxmail
      - 科信软件-kxmail
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.kxmail.net")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/systemfunction.pack.js")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"lo_computername")
expression: r0() || r1() || r2()
