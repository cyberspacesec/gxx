id: ufttt-iot-platform
info:
  name: ufttt-iot
  author: archer
  verified: false
  description: 检测到ufttt-iot系统或组件的特征
  created: 2025/04/24
  product:
    id: ufttt.iot-platform
    name: UFTTT 物联网平台
    category: application
    identity: product
    assurance: inferred
    tags:
      - iot-platform
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"sdkjs/uftttsdk2.js\"")
expression: r0()
