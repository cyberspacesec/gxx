id: ntop
info:
  name: ntop
  author: archer
  verified: false
  description: 检测到ntop系统或组件的特征
  created: 2025/04/24
  product:
    id: ntop.ntop
    name: ntop
    vendor: ntop
    category: application
    identity: product
    assurance: verified
    tags:
      - monitoring
    references:
      - https://www.ntop.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"global traffic statistics")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ntopmenuid")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/css/ntopng.css")
expression: r0() || r1() || r2()
