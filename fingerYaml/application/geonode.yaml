id: geonode
info:
  name: geonode
  author: archer
  verified: false
  description: 检测到geonode系统或组件的特征
  created: 2025/04/24
  product:
    id: geonode.geonode
    name: GeoNode
    category: application
    identity: product
    assurance: verified
    references:
      - https://geonode.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://geonode.org")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/catalogue/opensearch\" title=\"geonode search")
expression: r0() || r1()
