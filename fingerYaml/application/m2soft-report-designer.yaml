id: m2soft-report-designer
info:
  name: m2soft-rdserver
  author: archer
  verified: false
  description: 检测到m2soft-rdserver系统或组件的特征
  created: 2025/04/24
  product:
    id: m2soft.report-designer
    name: M2Soft Report Designer Server
    vendor: M2Soft
    category: application
    identity: product
    assurance: inferred
    tags:
      - bi
    aliases:
      - m2soft-rdserver
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: rdserver")'
expression: r0()
