id: wanhu-ezoffice-portal-redirect
info:
  name: ezoffice
  author: archer
  verified: false
  description: 检测到ezoffice系统或组件的特征
  created: 2025/04/24
  product:
    id: wanhu.ezoffice
    name: 万户 ezOFFICE
    vendor: 万户网络
    category: application
    identity: product
    assurance: inferred
    tags:
      - oa
    aliases:
      - ezOFFICE
      - 万户OA
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.status == 302 && response.raw_header.ibcontains(b"Location: /defaultroot/portal.jsp?access=oa")'
expression: r0()
