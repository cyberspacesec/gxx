id: mdaemon
info:
  name: mdaemon-email-server
  author: archer
  verified: false
  description: 检测到mdaemon-email-server系统或组件的特征
  created: 2025/04/24
  product:
    id: mdaemon.mdaemon
    name: MDaemon Email Server
    vendor: MDaemon Technologies
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - MDaemon
      - WorldClient
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/worldclient.dll?view=main")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"mdaemon ")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<strong>mdaemon/worldclient")
expression: r0() || r1() || r2()
