id: sourceworx-sx-shop
info:
  name: sx-shop
  author: archer
  verified: false
  description: 检测到sx-shop系统或组件的特征
  created: 2025/04/24
  product:
    id: sourceworx.sx-shop
    name: sx-shop
    vendor: Source Worx
    category: application
    identity: product
    assurance: inferred
    tags:
      - ecommerce
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"alert(\"ihr suchbegriff muss mind. aus 3 zeichen bestehen.\");")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"source worx - software development\">")
expression: r0() || r1()
