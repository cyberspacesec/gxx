id: gitbucket
info:
  name: gitbucket
  author: archer
  verified: false
  description: 检测到gitbucket系统或组件的特征
  created: 2025/04/24
  product:
    id: gitbucket.gitbucket
    name: GitBucket
    category: application
    identity: product
    assurance: verified
    tags:
