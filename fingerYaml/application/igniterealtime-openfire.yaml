id: igniterealtime-openfire
info:
  name: openfire
  author: archer
  verified: false
  description: 检测到openfire系统或组件的特征
  created: 2025/04/24
  product:
    id: igniterealtime.openfire
    name: Openfire
    category: application
    identity: product
    assurance: verified
    tags:
      - im
    references:
      - https://www.igniterealtime.org/projects/openfire/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"background: transparent url(images/login_logo.gif) no-repeat")'
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>openfire 管理界面</title>")
expression: r0() || r1()
