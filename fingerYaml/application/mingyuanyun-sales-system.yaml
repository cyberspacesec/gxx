id: mingyuanyun-sales-system
info:
  name: mingyuanyun-sales
  author: archer
  verified: false
  description: 检测到mingyuanyun-sales系统或组件的特征
  created: 2025/04/24
  product:
    id: mingyuanyun.sales-system
    name: 明源售楼管理系统
    vendor: 明源云
    category: application
    identity: product
    assurance: inferred
    tags:
      - crm
    aliases:
      - 明源售楼系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<img id=\"erp\" src=\"/_imgs/login/zs_erp.png")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"value=\"明源售楼管理系统v5.0\"")
expression: r0() || r1()
