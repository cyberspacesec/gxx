id: realvnc-vnc-server
info:
  name: vnc-enterprise-
  author: archer
  verified: false
  description: 检测到vnc-enterprise-系统或组件的特征
  created: 2025/04/24
  product:
    id: realvnc.vnc-server
    name: RealVNC VNC Server
    vendor: RealVNC
    category: application
    identity: product
    assurance: inferred
    tags:
      - remote-access
    aliases:
      - VNC Server Enterprise Edition
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: vnc server enterprise edition")'
expression: r0()
