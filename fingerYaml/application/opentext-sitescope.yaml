id: opentext-sitescope
info:
  name: hp-sitescope
  author: archer
  verified: false
  description: 检测到hp-sitescope系统或组件的特征
  created: 2025/04/24
  product:
    id: opentext.sitescope
    name: SiteScope
    vendor: OpenText
    category: application
    identity: product
    assurance: inferred
    tags:
      - monitoring
    aliases:
      - hp-sitescope
      - HP SiteScope
      - Micro Focus SiteScope
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"sitescope login")
expression: r0()
