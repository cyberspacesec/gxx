id: join-cheer-netrep-financial
info:
  name: join-cheer-general-financial-system
  author: archer
  verified: false
  description: 检测到join-cheer-general-financial-system系统或组件的特征
  created: 2025/04/24
  product:
    id: join-cheer.netrep
    name: 久其网络报表系统
    vendor: 久其软件
    category: application
    identity: product
    assurance: inferred
    tags:
      - bi
    aliases:
      - join_cheer-report
      - join-cheer-general-financial-system
      - 久其通用财务系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"北京久其软件股份有限公司 版权所有")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/netrep/intf") && response.body.ibcontains(b"/netrep/message2/")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<meta http-equiv=\"refresh\" content=\"0\";url=\"../netrep\">")
expression: r0() || r1() || r2()
