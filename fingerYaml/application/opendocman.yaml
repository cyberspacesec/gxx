id: opendocman
info:
  name: opendocman
  author: archer
  verified: false
  description: 检测到opendocman系统或组件的特征
  created: 2025/04/24
  product:
    id: opendocman.opendocman
    name: OpenDocMan
    category: application
    identity: product
    assurance: inferred
    tags:
      - document-management
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"welcome to opendocman")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"target=\"_new\">opendocman")
expression: r0() || r1()
