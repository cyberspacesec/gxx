id: opengoss-wlan-nms
info:
  name: opengoss-wlan
  author: archer
  verified: false
  description: 检测到opengoss-wlan系统或组件的特征
  created: 2025/04/24
  product:
    id: opengoss.wlan-nms
    name: WLAN 综合网管系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - monitoring
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/stylesheets/themes/wifi2/ui.theme.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"wlan综合网管系统\"")
expression: r0() || r1()
