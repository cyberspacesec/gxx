id: ibm-openadmin-tool
info:
  name: ibm_openadmin_tool
  author: archer
  verified: false
  description: 检测到ibm_openadmin_tool系统或组件的特征
  created: 2025/04/24
  product:
    id: ibm.openadmin-tool
    name: OpenAdmin Tool for Informix
    vendor: IBM
    category: application
    identity: product
    assurance: inferred
    tags:
      - db-admin
    aliases:
      - ibm_openadmin_tool
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"oat oneui\"")
expression: r0()
