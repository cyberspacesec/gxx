id: pommo
info:
  name: pommo
  author: archer
  verified: false
  description: 检测到pommo系统或组件的特征
  created: 2025/04/24
  product:
    id: pommo.pommo
    name: poMMo
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.pommo.org/")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"pommo.confirmmsg = ")
expression: r0() || r1()
