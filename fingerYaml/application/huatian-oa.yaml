id: huatian-oa
info:
  name: 华天动力协同oa办公系统
  author: archer
  verified: false
  description: 检测到华天动力协同oa办公系统系统或组件的特征
  created: 2025/04/24
  product:
    id: huatian.oa
    name: 华天动力协同 OA
    vendor: 华天动力
    category: application
    identity: product
    assurance: inferred
    tags:
      - oa
    aliases:
      - 华天动力OA
      - OA8000
      - cnpower-oa
      - 华天动力协同oa办公系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"/OAapp/WebObjects/OAapp.woa")
  r1:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"/OAapp/htpages/app/module/")
expression: r0() || r1()
