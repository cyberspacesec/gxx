id: nextcloud
info:
  name: nextcloud-product
  author: archer
  verified: false
  description: 检测到nextcloud-product系统或组件的特征
  created: 2025/04/24
  product:
    id: nextcloud.nextcloud
    name: Nextcloud
    vendor: Nextcloud GmbH
    category: application
    identity: product
    assurance: verified
    tags:
      - storage
      - cloud
    references:
      - https://nextcloud.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"nextcloud</a> – 给您所有数据一个安全的家")
expression: r0()
