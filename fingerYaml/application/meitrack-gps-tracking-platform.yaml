id: meitrack-gps-tracking-platform
info:
  name: meitrack
  author: archer
  verified: false
  description: 检测到meitrack系统或组件的特征
  created: 2025/04/24
  product:
    id: meitrack.gps-tracking-platform
    name: Meitrack GPS 跟踪平台
    vendor: Meitrack
    category: application
    identity: product
    assurance: inferred
    tags:
      - iot-platform
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"action=\"trackerlogin.aspx")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"_trackermain_gtvtseries")
expression: r0() || r1()
