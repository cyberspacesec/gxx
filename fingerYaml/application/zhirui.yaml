id: zhirui
info:
  name: zhirui
  author: archer
  verified: false
  description: 检测到zhirui系统或组件的特征
  created: 2025/04/24
  product:
    id: zhirui.zhirui
    name: 智睿软件系统
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"智睿软件")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"zhirui.js")
expression: r0() || r1()
