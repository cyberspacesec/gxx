id: apereo-uportal
info:
  name: uportal
  author: archer
  verified: false
  description: 检测到uportal系统或组件的特征
  created: 2025/04/24
  product:
    id: apereo.uportal
    name: uPortal
    vendor: Apereo Foundation
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"alt=\"powered by uportal")
expression: r0()
