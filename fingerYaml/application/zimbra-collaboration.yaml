id: zimbra-collaboration
info:
  name: zimbra
  author: archer
  verified: false
  description: 检测到zimbra系统或组件的特征
  created: 2025/04/24
  product:
    id: zimbra.collaboration
    name: Zimbra Collaboration
    vendor: Synacor
    category: application
    identity: product
    assurance: verified
    tags:
      - mail
    aliases:
      - Zimbra
    references:
      - https://www.zimbra.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"ImgZimbraIcon") && response.raw_header.ibcontains(b"Set-Cookie: ZM_LOGIN_CSRF")'
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window._zimbramail")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"zimbra")
expression: r0() || r1() || r2()
