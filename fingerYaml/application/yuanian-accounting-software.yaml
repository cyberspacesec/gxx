id: yuanian-accounting-software
info:
  name: yuanian-accounting-software
  author: archer
  verified: false
  description: 检测到yuanian-accounting-software系统或组件的特征
  created: 2025/04/24
  product:
    id: yuanian.accounting-software
    name: 元年财务软件
    vendor: 元年科技
    category: application
    identity: product
    assurance: inferred
    tags:
      - erp
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"yuannian.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/image/logo/yuannian.gif")
expression: r0() || r1()
