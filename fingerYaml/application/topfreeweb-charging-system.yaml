id: topfreeweb-charging-system
info:
  name: topfreeweb-charging
  author: archer
  verified: false
  description: 检测到topfreeweb-charging系统或组件的特征
  created: 2025/04/24
  product:
    id: topfreeweb.charging-system
    name: TopFreeWeb 收费系统
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"background=\"images/logbg.jpg\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"value=\"经理\">经理</option>")
expression: r0() || r1()
