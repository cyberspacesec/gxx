id: qianxing-oa-mystat
info:
  name: qianxing-oa
  author: archer
  verified: false
  description: 检测到qianxing-oa系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxing.oa
    name: 乾星 OA 企业智能办公自动化系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - oa
    aliases:
      - qianxing-oa
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"input name=\"s1\" type=\"image\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"count/mystat.asp")
expression: r0() || r1()
