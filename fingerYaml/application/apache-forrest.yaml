id: apache-forrest
info:
  tags: application
  reference:
    - https://forrest.apache.org/
  name: apache-forrest
  author: archer
  verified: false
  description: 将多种来源内容组织为网站及文档的发布框架。
  created: 2025/04/24
  product:
    id: apache.forrest
    name: Apache Forrest
    vendor: Apache Software Foundation
    category: application
    identity: product
    assurance: verified
    tags:
      - application
    aliases:
      - apache-forrest
    references:
      - https://forrest.apache.org/
    description: 将多种来源内容组织为网站及文档的发布框架。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"content=\"apache forrest")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"name=\"forrest")
expression: r0() || r1()
