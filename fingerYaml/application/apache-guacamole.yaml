id: apache-guacamole
info:
  tags: application
  reference:
    - https://guacamole.apache.org/
  name: apache-guacamole
  author: archer
  verified: false
  description: 通过浏览器访问远程桌面的网关。
  created: 2025/04/24
  product:
    id: apache.guacamole
    name: Apache Guacamole
    vendor: Apache Software Foundation
    category: application
    identity: product
    assurance: verified
    tags:
      - application
      - remote-access
    aliases:
      - apache-guacamole
    references:
      - https://guacamole.apache.org/
    description: 通过浏览器访问远程桌面的网关。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"images/guacamole-logo")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"guacamole - clientless remote desktop") && response.body.ibcontains(b"scripts/guac-ui.js")
expression: r0() || r1()
