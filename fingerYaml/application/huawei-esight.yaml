id: huawei-esight
info:
  name: huawei-esight
  author: archer
  verified: false
  description: 检测到huawei-esight系统或组件的特征
  created: 2025/04/24
  product:
    id: huawei.esight
    name: eSight
    vendor: 华为
    category: application
    identity: product
    assurance: inferred
    tags:
      - monitoring
    aliases:
      - huawei-esight
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"location.replace('login.action?_='+ new date().gettime());")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<body onload=\"gotologin()\">")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"esight_login_copy_right_font")
expression: r0() || r1() || r2()
