id: wanhu-flexoffice
info:
  name: whir-flexoffice
  author: archer
  verified: false
  description: 检测到whir-flexoffice系统或组件的特征
  created: 2025/04/16
  product:
    id: wanhu.flexoffice
    name: 万户 FlexOffice
    vendor: 万户网络
    category: application
    identity: product
    assurance: inferred
    tags:
      - oa
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var flexofficepath=\"\\/flexoffice\"")
expression: r0()
