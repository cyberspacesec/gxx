id: jloa-oa
info:
  name: jloa
  author: archer
  verified: false
  description: 检测到jloa系统或组件的特征
  created: 2025/04/24
  product:
    id: jloa.oa
    name: JLOA
    category: application
    identity: product
    assurance: inferred
    tags:
      - oa
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"logintable") && response.body.ibcontains(b"selectcss") && response.body.ibcontains(b"toptitleimg")
expression: r0()
