id: thoughtworks-gocd
info:
  name: gocd-params
  author: archer
  verified: true
  description: 检测到gocd-params系统或组件的特征
  created: 2025/04/24
  product:
    id: thoughtworks.gocd
    name: GoCD
    vendor: Thoughtworks
    category: application
    identity: product
    assurance: inferred
    tags:
      - ci
      - devops
    references:
      - https://www.gocd.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-1576282848"
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"gocd-params")
expression: r0() || r1()
