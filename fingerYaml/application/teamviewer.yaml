id: teamviewer
info:
  name: teamviewer
  author: archer
  verified: false
  description: 检测到teamviewer系统或组件的特征
  created: 2025/04/24
  product:
    id: teamviewer.teamviewer
    name: TeamViewer
    vendor: TeamViewer
    category: application
    identity: product
    assurance: verified
    tags:
      - remote-access
    references:
      - https://www.teamviewer.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"teamviewer") && response.body.ibcontains(b"this site is running")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href='http://www.teamviewer.com'>teamviewer</a>")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"this site is running")
expression: r0() || r1() || r2()
