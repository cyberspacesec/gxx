id: mibew-mibew-messenger
info:
  name: mibew-messenger
  author: archer
  verified: false
  description: 检测到mibew-messenger系统或组件的特征
  created: 2025/04/24
  product:
    id: mibew.mibew-messenger
    name: Mibew Messenger
    category: application
    identity: product
    assurance: verified
    tags:
      - im
    references:
      - https://mibew.org/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"empty_inner")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"flink\">mibew messenger")
expression: r0() || r1()
