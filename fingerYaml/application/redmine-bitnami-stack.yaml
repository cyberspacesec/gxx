id: redmine-bitnami-stack
info:
  name: bitnami-redmine-stack
  author: archer
  verified: false
  description: 检测到bitnami-redmine-stack系统或组件的特征
  created: 2025/04/24
  product:
    id: redmine.redmine
    name: Redmine
    category: application
    identity: product
    assurance: verified
