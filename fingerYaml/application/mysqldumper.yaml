id: mysqldumper
info:
  name: mysqldumper
  author: archer
  verified: false
  description: 检测到mysqldumper系统或组件的特征
  created: 2025/04/24
  product:
    id: mysqldumper.mysqldumper
    name: MySQLDumper
    category: application
    identity: product
    assurance: inferred
    tags:
      - db-admin
      - backup
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<select class=\"sqlcombo\" name=\"tablecombo")
expression: r0()
