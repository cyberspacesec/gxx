id: promise-webpam
info:
  name: promise-webpam
  author: archer
  verified: false
  description: 检测到promise-webpam系统或组件的特征
  created: 2025/04/24
  product:
    id: promise.webpam
    name: WebPAM
    vendor: Promise Technology
    category: application
    identity: product
    assurance: inferred
    tags:
      - storage
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"js/promise/themes/apple/images/logo_promise.png")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"js/dojo/promise.js")
expression: r0() || r1()
