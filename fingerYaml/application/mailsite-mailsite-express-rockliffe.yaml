id: mailsite-mailsite-express-rockliffe
info:
  name: mailsiteexpress
  author: archer
  verified: false
  description: 检测到mailsiteexpress系统或组件的特征
  created: 2025/04/24
  product:
    id: mailsite.mailsite-express
    name: MailSite Express
    vendor: Rockliffe Systems
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - mailsite-express
      - mailsiteexpress
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"onsubmit=\"openexpress(document.expresslogin)")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"rockliffe systems, inc.")
expression: r0() || r1()
