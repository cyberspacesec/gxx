id: tableau-tableau-server
info:
  name: tableau
  author: archer
  verified: true
  description: 检测到tableau系统或组件的特征
  created: 2025/04/24
  product:
    id: tableau.tableau-server
    name: Tableau Server
    vendor: Tableau
    category: application
    identity: product
    assurance: inferred
    tags:
      - bi
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-1441956789"
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/javascripts/api/tableau-")
expression: r0() || r1()
