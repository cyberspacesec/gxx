id: avaya-aura-communication-manager
info:
  name: avaya-communication-manager
  author: archer
  verified: false
  description: 检测到avaya-communication-manager系统或组件的特征
  created: 2025/04/24
  product:
    id: avaya.aura-communication-manager
    name: Avaya Aura Communication Manager
    vendor: Avaya
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var newlocation = \"https://\" + target + \"/cgi-bin/common/issue\";")
expression: r0()
