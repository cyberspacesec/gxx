id: idcos-cloudboot
info:
  name: idcos-cloudboot
  author: archer
  verified: false
  description: 检测到idcos-cloudboot系统或组件的特征
  created: 2025/04/24
  product:
    id: idcos.cloudboot
    name: CloudBoot
    vendor: 云霁科技
    category: application
    identity: product
    assurance: inferred
    tags:
      - devops
    aliases:
      - idcos-cloudboot
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/clipboard/zeroclipboard.min")
expression: r0()
