rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-808437027"
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/portal/ui/openLogin/static/favicon.ico")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/portal/ui/static/favicon.ico")
expression: r0() || r1() || r2()
