id: liftoff-gateone
info:
  name: gate-one
  author: archer
  verified: false
  description: 检测到gate-one系统或组件的特征
  created: 2025/04/24
  product:
    id: liftoff.gateone
    name: Gate One
    vendor: Liftoff Software
    category: application
    identity: product
    assurance: inferred
    tags:
      - remote-access
    aliases:
      - GateOne
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"<div id=\"gateone\"></div>") && response.body.ibcontains(b"gateone.css") && response.body.ibcontains(b"gateone.js") && response.raw_header.ibcontains(b"Server: GateOne")'
expression: r0()
