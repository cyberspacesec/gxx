id: atmail
info:
  name: atmail
  author: archer
  verified: false
  description: 检测到atmail系统或组件的特征
  created: 2025/04/24
  product:
    id: atmail.atmail
    name: Atmail
    vendor: Atmail
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by atmail")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/index.php/mail/auth/processlogin")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<input id=\"mailserverinput")
expression: r0() || r1() || r2()
