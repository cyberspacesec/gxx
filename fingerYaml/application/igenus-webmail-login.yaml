id: igenus-webmail-login
info:
  name: igenus邮件系统
  author: archer
  verified: false
  description: 检测到igenus邮件系统系统或组件的特征
  created: 2025/04/24
  product:
    id: igenus.webmail
    name: iGENUS 邮件系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - igenus-webmail
      - igenus邮件系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"form.action = \"login.php?Cmd=login\";") && response.body.ibcontains(b"iGENUS")
expression: r0()
