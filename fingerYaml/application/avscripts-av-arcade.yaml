id: avscripts-av-arcade
info:
  name: av-arcade
  author: archer
  verified: false
  description: 检测到av-arcade系统或组件的特征
  created: 2025/04/24
  product:
    id: avscripts.av-arcade
    name: AV Arcade
    category: application
    identity: product
    assurance: inferred
    references:
      - http://www.avscripts.net/avarcade/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.avscripts.net/avarcade/")
expression: r0()
