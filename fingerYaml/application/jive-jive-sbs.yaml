id: jive-jive-sbs
info:
  name: jive-sbs
  author: archer
  verified: false
  description: 检测到jive-sbs系统或组件的特征
  created: 2025/04/24
  product:
    id: jive.jive-sbs
    name: Jive SBS
    vendor: Jive Software
    category: application
    identity: product
    assurance: inferred
    tags:
      - forum
    aliases:
      - jive-sbs
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/jive-icons.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"class=\"jive-body-formpage")
expression: r0() || r1()
