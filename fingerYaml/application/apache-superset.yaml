id: apache-superset
info:
  tags: application
  reference:
    - https://superset.apache.org/
  name: apache-superset
  author: archer
  verified: false
  description: 用于数据探索和可视化的业务分析平台。
  created: 2025/04/24
  product:
    id: apache.superset
    name: Apache Superset
    vendor: Apache Software Foundation
    category: application
    identity: product
    assurance: verified
    tags:
      - application
      - bi
    aliases:
      - apache-superset
    references:
      - https://superset.apache.org/
    description: 用于数据探索和可视化的业务分析平台。
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>Superset</title>")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/static/assets/images/superset-logo-")
expression: r0() || r1()
