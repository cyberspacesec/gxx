id: portainer
info:
  name: portainer
  author: archer
  verified: false
  description: 检测到portainer系统或组件的特征
  created: 2025/04/24
  product:
    id: portainer.portainer
    name: Portainer
    vendor: Portainer.io
    category: application
    identity: product
    assurance: verified
    tags:
      - container
    references:
      - https://www.portainer.io/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"ng-app=\"portainer\"")
expression: r0()
