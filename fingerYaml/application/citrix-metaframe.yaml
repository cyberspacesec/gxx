id: citrix-metaframe
info:
  name: citrix-metaframe
  author: archer
  verified: false
  description: 检测到citrix-metaframe系统或组件的特征
  created: 2025/04/24
  product:
    id: citrix.metaframe
    name: Citrix MetaFrame
    vendor: Citrix
    category: application
    identity: product
    assurance: inferred
    tags:
      - remote-access
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window.location=\"/citrix/metaframe")
expression: r0()
