id: beyeon-iot-platform
info:
  name: beyeon-iot
  author: archer
  verified: false
  description: 检测到beyeon-iot系统或组件的特征
  created: 2025/04/24
  product:
    id: beyeon.iot-platform
    name: Beyeon IoT Platform
    vendor: 郑州蓝视科技有限公司
    category: application
    identity: product
    assurance: inferred
    tags:
      - iot-platform
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"版权所有:郑州蓝视科技有限公司")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var app_smp_type_name = '门店';var app_grp_type_name = '集团'")
expression: r0() || r1()
