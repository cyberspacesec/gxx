id: hjsoft-hcm
info:
  name: 宏景CMS
  author: archer
  verified: false
  description: 检测到宏景CMS系统或组件的特征
  created: 2025/04/24
  product:
    id: hjsoft.hcm
    name: 宏景 HCM
    vendor: 宏景世纪软件
    category: application
    identity: product
    assurance: inferred
    tags:
      - hr
    aliases:
      - 宏景CMS
      - 宏景eHR
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/images/hcm/copyright.gif\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/images/hcm/themes/default/login/login_banner2.png?v=12334\"")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/general/sys/hjaxmanage.js\"")
expression: r0() || r1() || r2()
