id: bitkeeper
info:
  name: bitkeeper
  author: archer
  verified: false
  description: 检测到bitkeeper系统或组件的特征
  created: 2025/04/24
  product:
    id: bitkeeper.bitkeeper
    name: BitKeeper
    vendor: BitMover
    category: application
    identity: product
    assurance: inferred
    tags:
      - devops
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: bkhttp")'
expression: r0()
