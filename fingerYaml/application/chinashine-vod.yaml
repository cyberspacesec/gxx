id: chinashine-vod
info:
  name: china-shine-video-on-demand
  author: archer
  verified: false
  description: 检测到china-shine-video-on-demand系统或组件的特征
  created: 2025/04/24
  product:
    id: chinashine.vod
    name: 视翰视频点播系统
    vendor: 视翰
    category: application
    identity: product
    assurance: inferred
    tags:
      - video
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"视翰公司")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"background=\"images/cbackground.jpg\"")
expression: r0() || r1()
