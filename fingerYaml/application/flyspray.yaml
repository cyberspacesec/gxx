id: flyspray
info:
  name: flyspray
  author: archer
  verified: false
  description: 检测到flyspray系统或组件的特征
  created: 2025/04/24
  product:
    id: flyspray.flyspray
    name: Flyspray
    category: application
    identity: product
    assurance: inferred
