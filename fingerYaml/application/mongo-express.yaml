id: mongo-express
info:
  name: mongoexpress
  author: archer
  verified: false
  description: 检测到mongoexpress系统或组件的特征
  created: 2025/04/24
  product:
    id: mongo-express.mongo-express
    name: mongo-express
    category: application
    identity: product
    assurance: verified
    tags:
      - db-admin
    aliases:
      - Mongo Express
    references:
      - https://github.com/mongo-express/mongo-express
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Mongo Express") && response.body.ibcontains(b"mongo-express-logo.png")
expression: r0()
