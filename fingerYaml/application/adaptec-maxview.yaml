id: adaptec-maxview
info:
  name: adaptec-maxview
  author: archer
  verified: false
  description: 检测到adaptec-maxview系统或组件的特征
  created: 2025/04/24
  product:
    id: adaptec.maxview
    name: maxView Storage Manager
    vendor: Adaptec
    category: application
    identity: product
    assurance: inferred
    tags:
      - storage
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"action=\"/maxview/manager/login.xhtml")
expression: r0()
