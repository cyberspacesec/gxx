id: smartertools-smartermail-login
info:
  name: smartertools-smartermail
  author: archer
  verified: false
  description: 检测到smartertools-smartermail系统或组件的特征
  created: 2025/04/24
  product:
    id: smartertools.smartermail
    name: SmarterMail
    vendor: SmarterTools
    category: application
    identity: product
    assurance: verified
    tags:
      - mail
    references:
      - https://www.smartertools.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"login - smartermail") && response.body.ibcontains(b"<a href='http://www.smartertools.com/smartermail/mail-server-software.aspx' target='_blank'>smartermail")
expression: r0()
