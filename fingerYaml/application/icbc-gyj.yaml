id: icbc-gyj
info:
  name: icbc-gyj
  author: archer
  verified: false
  description: 检测到icbc-gyj系统或组件的特征
  created: 2025/04/24
  product:
    id: icbc.gyj
    name: 工商银行 gyj 应用
    vendor: 中国工商银行
    category: application
    identity: product
    assurance: inferred
    tags:
      - payment
    aliases:
      - icbc-gyj
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var s3_app_address=\"https://gyj.icbc.com.cn\"")
expression: r0()
