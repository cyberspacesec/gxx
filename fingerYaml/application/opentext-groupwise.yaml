id: opentext-groupwise
info:
  name: novell-groupwise
  author: archer
  verified: false
  description: 检测到novell-groupwise系统或组件的特征
  created: 2025/04/24
  product:
    id: opentext.groupwise
    name: GroupWise
    vendor: OpenText
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - Novell GroupWise
      - Micro Focus GroupWise
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<!-- start novell services")
  r1:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Set-Cookie: njscn=")'
expression: r0() || r1()
