id: logmein-remotelyanywhere
info:
  name: remotelyanywhere
  author: archer
  verified: false
  description: 检测到remotelyanywhere系统或组件的特征
  created: 2025/04/24
  product:
    id: logmein.remotelyanywhere
    name: RemotelyAnywhere
    vendor: LogMeIn
    category: application
    identity: product
    assurance: inferred
    tags:
      - remote-access
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/img/ralogo.png\" alt=\"remotelyanywhere")
  r1:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: remotelyanywhere")'
expression: r0() || r1()
