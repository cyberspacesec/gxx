id: quarkmail
info:
  name: quarkmail
  author: archer
  verified: false
  description: 检测到quarkmail系统或组件的特征
  created: 2025/04/24
  product:
    id: quarkmail.quarkmail
    name: Quarkmail 邮件系统
    category: application
    identity: product
    assurance: inferred
    tags:
      - mail
    aliases:
      - quarkmail
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window.location.replace(\"/cgi-bin/web2cgi/index.cgi\");")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<iframe src=\"/cgi-bin/web2cgi/index.cgi\" scrolling=\"no\" frameborder=")
expression: r0() || r1()
