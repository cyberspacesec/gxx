id: adviserlogic
info:
  name: adviserlogiccli
  author: archer
  verified: false
  description: 检测到adviserlogiccli系统或组件的特征
  created: 2025/04/24
  product:
    id: adviserlogic.adviserlogic
    name: AdviserLogic
    category: application
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"navigator.serviceworker.register('/adviserlogiccache.js')")
expression: r0()
