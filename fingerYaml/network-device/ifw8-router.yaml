id: ifw8-router
info:
  name: 蜂网企业流控云路由器
  author: archer
  verified: false
  description: 检测到蜂网企业流控云路由器系统或组件的特征
  created: 2025/04/24
  product:
    id: ifw8.router
    name: 蜂网企业流控云路由器
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ifw8") && response.body.ibcontains(b"login") && response.body.ibcontains(b"企业级流控云路由器")
expression: r0()
