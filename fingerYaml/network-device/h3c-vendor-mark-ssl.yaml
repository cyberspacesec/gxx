id: h3c-vendor-mark-ssl
info:
  name: h3c-web-managerment-home
  author: archer
  verified: false
  description: 检测到h3c-web-managerment-home系统或组件的特征
  created: 2025/04/24
  product:
    id: h3c.vendor-mark
    name: 新华三厂商标识
    vendor: 新华三
    category: network-device
    identity: signal
    assurance: inferred
    aliases:
      - H3C Web 网管
      - h3c-web-managerment-home
      - h3c-web网管
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/wnm/ssl/web/frame/login.html")
expression: r0()
