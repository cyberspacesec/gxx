id: wayos-router
info:
  name: wayos维盟ac集中管理系统
  author: archer
  verified: false
  description: 检测到wayos维盟ac集中管理系统系统或组件的特征
  created: 2025/04/24
  product:
    id: wayos.router
    name: 维盟智能路由管理系统
    vendor: 维盟科技
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - gateway
      - router
    aliases:
      - WayOS AC
      - 维盟AC集中管理系统
      - WayOS
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>维盟（WayOS）智能路由管理系统  www.wayos.cn</title>")
expression: r0()
