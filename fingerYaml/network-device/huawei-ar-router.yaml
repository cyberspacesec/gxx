id: huawei-ar-router
info:
  name: 华为AR路由器
  author: archer
  verified: false
  description: 检测到华为AR路由器系统或组件的特征
  created: 2025/04/24
  product:
    id: huawei.ar-router
    name: AR 系列路由器
    vendor: 华为
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
      - gateway
    aliases:
      - 华为AR路由器
      - huawei-ar敏捷网关
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"simple/util/ui/all/allUI.css") && response.body.ibcontains(b"/view/loginUser.html")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"AR Web登录") && response.body.ibcontains(b"Log In to AR Web")
expression: r0() || r1()
