id: ruijie-rsr-router
info:
  name: 锐捷-RSR-Router
  author: archer
  verified: false
  description: 检测到锐捷-RSR-Router系统或组件的特征
  created: 2025/04/24
  product:
    id: ruijie.rsr-router
    name: 锐捷 RSR 系列路由器
    vendor: 锐捷网络
    category: network-device
    identity: product
    assurance: inferred
    tags:
