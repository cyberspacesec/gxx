id: juniper-hdr
info:
  name: juniper-hdr
  author: archer
  verified: false
  description: 检测到juniper-hdr系统或组件的特征
  created: 2025/04/24
  product:
    id: juniper.hdr
    name: Juniper HDR
    vendor: Juniper
    category: network-device
    identity: product
    assurance: inferred
    aliases:
      - juniper-hdr
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/stylesheet/juniper.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/hdr_logo.gif")
expression: r0() || r1()
