id: qianxin-secure-routing-gateway
info:
  name: 奇安信网神安全网络路由网关系统
  author: archer
  verified: false
  description: 检测到奇安信网神安全网络路由网关系统系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxin.secure-routing-gateway
    name: 奇安信网神安全网络路由网关系统
    vendor: 奇安信
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
      - gateway
    references:
      - https://www.qianxin.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"web/resources/favicon.ico") && response.body.ibcontains(b"__httpsVerify")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>奇安信网神安全网络路由网关系统</title>")
expression: r0() || r1()
