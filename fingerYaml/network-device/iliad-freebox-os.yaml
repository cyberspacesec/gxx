id: iliad-freebox-os
info:
  name: iliad-freeboxos
  author: archer
  verified: false
  description: 检测到iliad-freeboxos系统或组件的特征
  created: 2025/04/24
  product:
    id: iliad.freebox-os
    name: Freebox OS
    vendor: Iliad
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
    aliases:
      - iliad-freeboxos
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"logo_freeboxos")
expression: r0()
