id: hispider-router
info:
  name: hispider-router
  author: archer
  verified: false
  description: 检测到hispider-router系统或组件的特征
  created: 2025/04/24
  product:
    id: hispider.router
    name: HiSpider 路由器
    category: network-device
    identity: product
    assurance: inferred
    tags:
