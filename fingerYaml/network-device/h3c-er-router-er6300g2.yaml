id: h3c-er-router-er6300g2
info:
  name: h3c-er6300g2
  author: archer
  verified: false
  description: 检测到h3c-er6300g2系统或组件的特征
  created: 2025/04/24
  product:
    id: h3c.er-router
    name: H3C ER 系列路由器
    vendor: 新华三
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ER6300G2") && response.body.ibcontains(b"h3c.com") && response.body.ibcontains(b"login")
expression: r0()
