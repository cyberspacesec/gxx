id: huawei-vendor-mark-inner-web
info:
  name: huawei-inner-web
  author: archer
  verified: false
  description: 检测到huawei-inner-web系统或组件的特征
  created: 2025/04/24
  product:
    id: huawei.vendor-mark
    name: 华为厂商标识
    vendor: 华为
    category: network-device
    identity: signal
    assurance: inferred
    aliases:
      - 华为网络设备
      - 华为设备内置 Web 管理界面
      - huawei-inner-web
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"hidden_frame.html")
expression: r0()
