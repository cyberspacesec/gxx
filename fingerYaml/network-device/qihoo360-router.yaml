id: qihoo360-router
info:
  name: 360-安全路由
  author: archer
  verified: false
  description: 检测到360-安全路由系统或组件的特征
  created: 2025/04/24
  product:
    id: qihoo360.router
    name: 360安全路由
    vendor: "360"
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - router
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"360安全路由") && response.body.ibcontains(b"360loginflag")
expression: r0()
