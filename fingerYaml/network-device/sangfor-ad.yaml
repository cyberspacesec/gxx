id: sangfor-ad
info:
  name: 深信服应用交付管理系统
  author: archer
  verified: true
  description: 检测到深信服应用交付管理系统的特征
  created: 2025/04/24
  product:
    id: sangfor.ad
    name: 深信服应用交付 AD
    vendor: 深信服
    category: network-device
    identity: product
    assurance: inferred
    tags:
      - load-balancer
    aliases:
      - 深信服应用交付管理系统
    references:
      - https://www.sangfor.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-1810847295"
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/static/es6_polyfill/polyfill.js")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"user_blur();")
  r3:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"/reportCenter/index.php?cls_mode=cluster_mode_others")
expression: r0() || r1() || r2() || r3()
