id: apache-dubbo
info:
  reference:
    - https://dubbo.apache.org/
  name: Apache dubbo
  author: zhizhuo
  verified: true
  description: 微服务 RPC 通信、服务发现与治理框架。
  tags: web,fofa,converted,framework
  created: 2025/04/07
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.raw_header.ibcontains(b"Basic realm=\"dubbo")
expression: r0()
