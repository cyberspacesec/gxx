id: abyss-web-server
info:
  reference:
    - https://aprelium.com/abyssws/
  name: Detect Abyss Web Server
  author: zhizhuo
  verified: true
  description: Aprelium 提供的 Web 服务器。
  tags: web,fofa,converted,web-server
  created: 2025/04/07
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Welcome to Abyss Web Server")
expression: r0()