id: apache-detect
info:
  reference:
    - https://httpd.apache.org/
  name: Apache
  author: zhizhuo
  verified: true
  description: 提供 HTTP 服务的开源 Web 服务器。
  tags: web,fofa,converted,web-server
  created: 2025/04/07
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.raw_header.ibcontains(b"Apache+")
expression: r0()