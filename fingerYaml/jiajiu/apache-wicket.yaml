id: web-apache-wicket
info:
  tags: framework
  reference:
    - https://wicket.apache.org/
  name: apache-wicket
  author: archer
  verified: false
  description: 基于组件的 Java Web 应用框架。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"xmlns:wicket=")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/org.apache.wicket.")
expression: r0() || r1()
