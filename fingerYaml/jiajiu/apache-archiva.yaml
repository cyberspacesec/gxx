id: web-apache-archiva
info:
  tags: application
  reference:
    - https://archiva.apache.org/
  name: apache-archiva
  author: archer
  verified: false
  description: 用于构建产物存储、代理和检索的仓库管理器。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/archiva.js")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/archiva.css")
expression: r0() || r1()
