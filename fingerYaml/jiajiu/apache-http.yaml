id: web-apache-http
info:
  tags: web-server
  reference:
    - https://httpd.apache.org/
  name: apache-http
  author: archer
  verified: false
  description: 提供 HTTP 服务的开源 Web 服务器。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"server: Apache")'
    output:
      product_version: >-
        "(?im)^server:\\s*Apache/(?<version>[0-9]+(?:[.][0-9]+){1,3}(?:[-_][a-zA-Z0-9.]+)?)".bsubmatch(response.raw_header)["version"]
expression: r0()
