id: web-apache-couchdb
info:
  tags: database
  reference:
    - https://couchdb.apache.org/
  name: apache-couchdb
  author: archer
  verified: true
  description: 使用 JSON 文档和 HTTP 接口的数据库。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"x-couchdb-body-time: 0") && response.raw_header.ibcontains(b"Server: CouchDB")'
  r1:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-1346006262"
expression: r0() || r1()
