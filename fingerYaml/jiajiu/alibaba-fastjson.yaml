id: web-alibaba-fastjson
info:
  name: alibaba-fastjson
  author: archer
  verified: false
  description: Java JSON 解析库，依据 Fastjson 1 的异常类和解析器类名称识别。
  reference:
    - https://github.com/alibaba/fastjson
  tags: library,json,java
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.bcontains(b"com.alibaba.fastjson.JSONException")
    output:
      product_version: >-
        "(?i)fastjson[-/](?<version>1[.][0-9]+(?:[.][0-9]+)?(?:[-_][a-zA-Z0-9.]+)?)".bsubmatch(response.body)["version"]
  r1:
    request:
      method: GET
      path: /
    expression: response.body.bcontains(b"com.alibaba.fastjson.parser.DefaultJSONParser")
    output:
      product_version: >-
        "(?i)fastjson[-/](?<version>1[.][0-9]+(?:[.][0-9]+)?(?:[-_][a-zA-Z0-9.]+)?)".bsubmatch(response.body)["version"]
  r2:
    request:
      method: GET
      path: /
    expression: response.body.bcontains(b"com.alibaba.fastjson.parser.JSONLexerBase")
    output:
      product_version: >-
        "(?i)fastjson[-/](?<version>1[.][0-9]+(?:[.][0-9]+)?(?:[-_][a-zA-Z0-9.]+)?)".bsubmatch(response.body)["version"]
expression: r0() || r1() || r2()
