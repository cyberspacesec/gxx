id: web-apache-airflow
info:
  tags: application
  reference:
    - https://airflow.apache.org/
  name: apache-airflow
  author: archer
  verified: false
  description: 以代码定义、调度和监控工作流的平台。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"src=\"/static/pin_100.png\"")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<span>airflow</span>")
expression: r0() || r1()
