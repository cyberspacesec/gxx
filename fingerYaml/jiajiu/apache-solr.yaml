id: web-apache-solr
info:
  tags: database
  reference:
    - https://solr.apache.org/
  name: apache-solr
  author: archer
  verified: false
  description: 提供全文检索与数据分析功能的搜索平台。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.status == 302 && response.raw_header.ibcontains(b"Location: /solr/")'
expression: r0()
