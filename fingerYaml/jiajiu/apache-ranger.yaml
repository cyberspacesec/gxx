id: web-apache-ranger
info:
  tags: security
  reference:
    - https://ranger.apache.org/
  name: apache-ranger
  author: archer
  verified: false
  description: 用于数据平台权限管理、授权与审计的框架。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<img src=\"images/ranger_logo.png\" alt=\"Ranger logo\">")
expression: r0()
