id: web-apache-dubbo
info:
  tags: framework
  reference:
    - https://dubbo.apache.org/
  name: apache-dubbo
  author: archer
  verified: false
  description: 微服务 RPC 通信、服务发现与治理框架。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"www-authenticate: Basic realm=\"dubbo\"")'
expression: r0()
