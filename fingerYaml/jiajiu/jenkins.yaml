id: web-jenkins
info:
  tags: application
  reference:
    - https://www.jenkins.io/
  name: jenkins
  author: archer
  verified: true
  description: 用于构建、测试和交付流程自动化的服务器。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: '"x-jenkins" in response.headers && "x-jenkins-session" in response.headers'
    output:
      product_version: >-
        "^(?<version>[0-9]+(?:[.][0-9]+){1,3})$".submatch(response.headers["x-jenkins"])["version"]
  r1:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "81586312"
  r2:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"jenkins-agent-protocols")
expression: r0() || r1() || r2()
