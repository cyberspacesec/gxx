id: web-apache-apisix-dashboard
info:
  tags: hosting-panel
  reference:
    - https://github.com/apache/apisix-dashboard
  name: apache-apisix-dashboard
  author: archer
  verified: true
  description: Apache APISIX 的 Web 管理界面。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<title>apache apisix dashboard</title>")
  r1:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "358172742"
expression: r0() || r1()
