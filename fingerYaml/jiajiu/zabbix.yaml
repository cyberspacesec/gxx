id: web-zabbix
info:
  tags: application
  reference:
    - https://www.zabbix.com/
  name: zabbix
  author: archer
  verified: false
  description: 用于监控网络、服务器与应用状态的系统。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Zabbix SIA") && response.body.ibcontains(b"zabbix")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"images/general/zabbix.ico")
expression: r0() || r1()
