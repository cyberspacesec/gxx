id: web-grafana
info:
  tags: application
  reference:
    - https://grafana.com/oss/grafana/
  name: grafana
  author: archer
  verified: false
  description: 用于查询、可视化与监控指标和日志的应用。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"grafana_icon.svg") && response.body.ibcontains(b"login")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window.grafanabootdata = ")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"grafana-app")
expression: r0() || r1() || r2()
