id: web-apache-flink
info:
  tags: middleware
  reference:
    - https://flink.apache.org/
  name: apache-flink
  author: archer
  verified: false
  description: 面向有界与无界数据流的分布式处理引擎。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"<title>Apache Flink Web Dashboard</title>")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<img alt=\"apache flink dashboard\" src=\"images/flink-logo.png")
expression: r0() || r1()
