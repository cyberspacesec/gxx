id: web-apache-kylin
info:
  tags: database
  reference:
    - https://kylin.apache.org/
  name: apache-kylin
  author: archer
  verified: false
  description: 面向多维分析与大规模数据查询的 OLAP 引擎。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.status == 200 && response.body.ibcontains(b"<meta http-equiv=\"refresh\" content=\"1;url=kylin\">")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/kylin/\"")
expression: r0() || r1()
