id: web-apache-oozie-web-console
info:
  tags: application
  reference:
    - https://oozie.apache.org/
  name: apache-oozie-web-console
  author: archer
  verified: false
  description: 用于 Hadoop 作业编排与调度的工作流系统。
  created: 2025/04/24
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"oozie-console")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href=\"/oozie\">oozie console")
expression: r0() || r1()
