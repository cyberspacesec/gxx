id: arvancloud-cdn
info:
  name: arvancloud
  author: archer
  verified: false
  description: 检测到arvancloud系统或组件的特征
  created: 2025/04/24
  product:
    id: arvancloud.cdn
    name: ArvanCloud CDN
    vendor: ArvanCloud
    category: other
    identity: product
    assurance: inferred
    tags:
      - cloud
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: arvancloud")'
expression: r0()
