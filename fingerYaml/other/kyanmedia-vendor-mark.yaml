  author: archer
  verified: false
  description: 检测到kyan-design系统或组件的特征
  created: 2025/04/24
  product:
    id: kyanmedia.vendor-mark
    name: Kyan Media 厂商标识
    vendor: Kyan Media
    category: other
    identity: signal
    assurance: inferred
