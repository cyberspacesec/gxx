id: digicert-geotrust-smartseal
info:
  name: geotrust-cert
  author: archer
  verified: false
  description: 检测到geotrust-cert系统或组件的特征
  created: 2025/04/24
  product:
    id: digicert.geotrust-smartseal
    name: GeoTrust 站点认证标识
    vendor: DigiCert
    category: other
    identity: signal
    assurance: inferred
    aliases:
      - GeoTrust Smart Icon
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"//smarticon.geotrust.com/si.js")
expression: r0()
