id: digicert-thawte-site-seal
info:
  name: symantec-thawte_ssl_cert
  author: archer
  verified: false
  description: 检测到symantec-thawte_ssl_cert系统或组件的特征
  created: 2025/04/24
  product:
    id: digicert.thawte-site-seal
    name: Thawte 站点签章
    vendor: DigiCert
    category: other
    identity: signal
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"https://seal.thawte.com/getthawteseal")
expression: r0()
