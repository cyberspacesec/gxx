id: foxycart
info:
  name: foxycart
  author: archer
  verified: false
  description: 检测到foxycart系统或组件的特征
  created: 2025/04/24
  product:
    id: foxycart.foxycart
    name: FoxyCart
    vendor: FoxyCart
    category: other
    identity: signal
    assurance: inferred
