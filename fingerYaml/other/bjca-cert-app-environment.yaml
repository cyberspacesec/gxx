id: bjca-cert-app-environment
info:
  name: bjca
  author: archer
  verified: false
  description: 检测到bjca系统或组件的特征
  created: 2025/04/24
  product:
    id: bjca.cert-app-environment
    name: BJCA 证书应用环境
    vendor: 北京数字认证
    category: other
    identity: signal
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<li><a href=\"/install/certapp_bd.exe\">下载证书应用环境</a></li>")
expression: r0()
