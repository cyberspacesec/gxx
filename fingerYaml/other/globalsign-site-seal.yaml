id: globalsign-site-seal
info:
  name: globalsign-cert
  author: archer
  verified: false
  description: 检测到globalsign-cert系统或组件的特征
  created: 2025/04/24
  product:
    id: globalsign.site-seal
    name: GlobalSign 站点认证标识
    vendor: GlobalSign
    category: other
    identity: signal
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"//seal.globalsign.com/siteseal")
expression: r0()
