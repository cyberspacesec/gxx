id: chnitc-vendor-mark
info:
  name: chnitc-system
  author: archer
  verified: false
  description: 检测到chnitc-system系统或组件的特征
  created: 2025/04/24
  product:
    id: chnitc.vendor-mark
    name: chnitc 科业厂商标识
    category: other
    identity: signal
    assurance: inferred
    references:
      - http://www.chnitc.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<a href=\"http://www.chnitc.com\" style=\"text-decoration:none;color:#fff;\">")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"科业开发团队出品")
expression: r0() || r1()
