id: webtrust-webtrust-seal
info:
  name: webtrust-cert
  author: archer
  verified: false
  description: 检测到webtrust-cert系统或组件的特征
  created: 2025/04/24
  product:
    id: webtrust.webtrust-seal
    name: WebTrust 认证标识
    category: other
    identity: signal
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"https://cert.webtrust.org/viewseal")
expression: r0()
