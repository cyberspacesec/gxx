id: bithighway-vendor-mark
info:
  name: bithighway-product
  author: archer
  verified: false
  description: 检测到bithighway-product系统或组件的特征
  created: 2025/04/24
  product:
    id: bithighway.vendor-mark
    name: 碧海威厂商标识
    vendor: 北京碧海威科技有限公司
    category: other
    identity: signal
    assurance: inferred
    references:
      - http://www.bithighway.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"href='http://www.bithighway.com' target=_blank>北京碧海威科技有限公司<")
expression: r0()
