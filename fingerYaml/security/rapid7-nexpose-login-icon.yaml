id: rapid7-nexpose-login-icon
info:
  name: nexpose
  author: archer
  verified: true
  description: 检测到nexpose系统或组件的特征
  created: 2025/04/24
  product:
    id: rapid7.nexpose
    name: Rapid7 Nexpose
    vendor: Rapid7
    category: security
    identity: product
    assurance: inferred
    tags:
      - vulnerability-scanner
    aliases:
      - Nexpose Security Console
      - InsightVM
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<label for=\"nexposeccusername\">Username</label>") && response.icon_hash == "-516760689"
expression: r0()
