id: zhongkewangwei-firewall
info:
  name: 中科网威-防火墙
  author: archer
  verified: false
  description: 检测到中科网威-防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: zhongkewangwei.firewall
    name: 中科网威防火墙
    vendor: 中科网威
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"北京中科网威") && response.body.ibcontains(b"<input type=\"checkbox\" id=\"authened_type\" name=\"authened_type\"><i class=\"checkbox\"></i>")
expression: r0()
