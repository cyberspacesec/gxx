id: wangjisian-mail-security-gateway
info:
  name: 网际思安邮件安全网关
  author: archer
  verified: false
  description: 检测到网际思安邮件安全网关系统或组件的特征
  created: 2025/04/24
  product:
    id: wangjisian.mail-security-gateway
    name: 网际思安邮件安全网关
    vendor: 网际思安
    category: security
    identity: product
    assurance: inferred
    tags:
      - mail
      - gateway
    aliases:
      - SQR反垃圾邮件系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"snspam/spam_request/")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"snspam/start_page.asp")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"spam_request/spam_requestact.asp")
expression: r0() || r1() || r2()
