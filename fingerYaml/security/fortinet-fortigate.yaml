id: fortinet-fortigate
info:
  name: fortinet-firewall
  author: archer
  verified: false
  description: 检测到fortinet-firewall系统或组件的特征
  created: 2025/04/24
  product:
    id: fortinet.fortigate
    name: FortiGate
    vendor: Fortinet
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
      - vpn
    aliases:
      - FortiOS
    references:
      - https://www.fortinet.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"fortitoken") && response.body.ibcontains(b"str_table.mail_token_msg")
expression: r0()
