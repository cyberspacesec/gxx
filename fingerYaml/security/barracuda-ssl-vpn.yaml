id: barracuda-ssl-vpn
info:
  name: barracuda-ssl-vpn
  author: archer
  verified: false
  description: 检测到barracuda-ssl-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: barracuda.ssl-vpn
    name: Barracuda SSL VPN
    vendor: Barracuda Networks
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"barracuda ssl vpn")
expression: r0()
