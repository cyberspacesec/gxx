id: jianwang-firewall
info:
  name: 简网科技-防火墙
  author: archer
  verified: false
  description: 检测到简网科技-防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: jianwang.firewall
    name: 简网科技防火墙
    vendor: 简网科技
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
    aliases:
      - 简网科技-防火墙
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"action=\"/logincheck\"") && response.body.ibcontains(b"class=\"login-head clearfix\"")
expression: r0()
