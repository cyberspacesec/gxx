id: hikvision-security-access-gateway
info:
  name: hikvision-安全网关
  author: archer
  verified: false
  description: 检测到hikvision-安全网关系统或组件的特征
  created: 2025/04/24
  product:
    id: hikvision.security-access-gateway
    name: 安全接入网关
    vendor: 海康威视
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
    aliases:
      - hikvision-安全网关
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"安全接入网关") && response.body.ibcontains(b"src=\"./webui/js/jquerylib/jquery-1.7.2.min.js\"")
expression: r0()
