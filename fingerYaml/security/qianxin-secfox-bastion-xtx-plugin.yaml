id: qianxin-secfox-bastion-xtx-plugin
info:
  name: OEM-奇安信堡垒机
  author: archer
  verified: false
  description: 检测到OEM-奇安信堡垒机系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxin.secfox-bastion
    name: 网神 SecFox 运维安全管理与审计系统
    vendor: 奇安信
    category: security
    identity: product
    assurance: inferred
    tags:
      - bastion
    aliases:
      - 奇安信堡垒机
      - SecFox
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"application/x-xtx-axhost")
expression: r0()
