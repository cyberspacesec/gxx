id: qianxin-tianqing-license-page
info:
  name: 360-tianqing
  author: archer
  verified: false
  description: 检测到360-tianqing系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxin.tianqing
    name: 奇安信天擎终端安全管理系统
    vendor: 奇安信
    category: security
    identity: product
    assurance: inferred
    tags:
      - endpoint
      - edr
    aliases:
      - 天擎终端安全管理系统
      - 360天擎
      - 奇安信天擎
      - 360新天擎
      - 天擎
      - 新天擎
    references:
      - https://www.qianxin.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"appid\":\"skylar6")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/task/index/detail?id={item.id}")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"已过期或者未授权，购买请联系4008-136-360")
expression: r0() || r1() || r2()
