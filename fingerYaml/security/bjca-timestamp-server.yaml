id: bjca-timestamp-server
info:
  name: timestamp-server
  author: archer
  verified: false
  description: 检测到timestamp-server系统或组件的特征
  created: 2025/04/24
  product:
    id: bjca.timestamp-server
    name: 数字认证时间戳服务器
    vendor: 北京数字认证
    category: security
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"北京数字认证股份有限公司")
expression: r0()
