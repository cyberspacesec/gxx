id: opzoon-security-gateway
info:
  name: 华御-安全网关
  author: archer
  verified: false
  description: 检测到华御-安全网关系统或组件的特征
  created: 2025/04/24
  product:
    id: opzoon.security-gateway
    name: 华御安全网关
    vendor: 华御
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
      - firewall
    aliases:
      - 华御-安全网关
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"var opzoon_ver") && response.body.ibcontains(b"copy_right = {cn : \"\", en ")'
expression: r0()
