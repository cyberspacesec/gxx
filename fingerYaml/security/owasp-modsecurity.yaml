id: owasp-modsecurity
info:
  name: modsecurity
  author: archer
  verified: false
  description: 检测到modsecurity系统或组件的特征
  created: 2025/04/24
  product:
    id: owasp.modsecurity
    name: ModSecurity
    vendor: OWASP
    category: security
    identity: product
    assurance: inferred
    tags:
      - waf
    aliases:
      - mod_security
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"this error was generated by mod_security")
expression: r0()
