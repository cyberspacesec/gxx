id: sophos-utm
info:
  name: sophos-utm-web-protection
  author: archer
  verified: false
  description: 检测到sophos-utm-web-protection系统或组件的特征
  created: 2025/04/24
  product:
    id: sophos.utm
    name: Sophos UTM
    vendor: Sophos
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
      - waf
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by utm web protection")
expression: r0()
