id: surfilter-surfnx
info:
  name: 任子行-surfnx安全网关
  author: archer
  verified: false
  description: 检测到任子行-surfnx安全网关系统或组件的特征
  created: 2025/04/24
  product:
    id: surfilter.surfnx
    name: 任子行 SurfNX 安全网关
    vendor: 任子行
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
rules:
