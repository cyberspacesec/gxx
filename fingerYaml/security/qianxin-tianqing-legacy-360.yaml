id: qianxin-tianqing-legacy-360
info:
  name: 360天擎终端安全管理系统
  author: archer
  verified: false
  description: 检测到360天擎终端安全管理系统系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxin.tianqing
    name: 奇安信天擎终端安全管理系统
    vendor: 奇安信
    category: security
    identity: product
    assurance: inferred
    tags:
      - endpoint
      - edr
    aliases:
      - 天擎终端安全管理系统
      - 360天擎
      - 奇安信天擎
      - 360新天擎
      - 天擎
      - 新天擎
    references:
      - https://www.qianxin.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"360entinst") && response.body.ibcontains(b"关于全网部署360私有云的通知")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"360天擎终端")
expression: r0() || r1()
