id: adt-iam-gateway
info:
  name: adt-iam网关控制台
  author: archer
  verified: false
  description: 检测到adt-iam网关控制台系统或组件的特征
  created: 2025/04/24
  product:
    id: adt.iam-gateway
    name: 安达通 IAM 网关
    vendor: 安达通
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"iam") && response.body.ibcontains(b"src=\"/page/assets/javascripts/adt.js\"")
expression: r0()
