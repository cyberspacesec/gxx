id: forgerock-openam
info:
  name: openam
  author: archer
  verified: false
  description: 检测到openam系统或组件的特征
  created: 2025/04/24
  product:
    id: forgerock.openam
    name: OpenAM
    vendor: ForgeRock
    category: security
    identity: product
    assurance: inferred
    tags:
      - sso
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"action=\"/openam/ui/login\"")
expression: r0()
