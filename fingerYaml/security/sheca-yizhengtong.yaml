id: sheca-yizhengtong
info:
  name: sheca-cert
  author: archer
  verified: false
  description: 检测到sheca-cert系统或组件的特征
  created: 2025/04/24
  product:
    id: sheca.yizhengtong
    name: SHECA 一证通
    vendor: 上海市数字证书认证中心
    category: security
    identity: product
    assurance: inferred
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"content: \"获取一证通信息异常。请检查数字证书是否正常运行")'
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<li class=\"in\" id=\"cert_li\">")
expression: r0() || r1()
