id: fujitsu-netshelter
info:
  name: fujitsu-netshelter-vpn
  author: archer
  verified: false
  description: 检测到fujitsu-netshelter-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: fujitsu.netshelter
    name: NetShelter
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"welcome to netshelter")
expression: r0()
