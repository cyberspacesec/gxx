id: huawei-svn
info:
  name: huawei-ssl-vpn
  author: archer
  verified: false
  description: 检测到huawei-ssl-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: huawei.svn
    name: SVN SSL VPN 网关
    vendor: 华为
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
    aliases:
      - huawei-ssl-vpn
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"Clear SSL cache successfully") && response.body.ibcontains(b"getCookie(\"SGDPortal\")") && response.body.ibcontains(b"SVN_GetLoginContextValue(")
expression: r0()
