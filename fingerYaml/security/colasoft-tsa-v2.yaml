id: colasoft-tsa-v2
info:
  name: colasoft-tsa
  author: archer
  verified: false
  description: 检测到colasoft-tsa系统或组件的特征
  created: 2025/04/24
  product:
    id: colasoft.tsa
    name: 科来网络全流量安全分析系统
    vendor: 科来
    category: security
    identity: product
    assurance: inferred
    tags:
      - ids
      - monitoring
    aliases:
      - 网络全流量安全分析系统（TSA）
      - 科来 TSA
      - TSA
      - colasoft-tsa
      - 科来-网络全流量安全分析系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"data-i18n=\"[html]username\">#username&nbsp;&nbsp;</td>")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"nfr=\"true\"")
expression: r0() || r1()
