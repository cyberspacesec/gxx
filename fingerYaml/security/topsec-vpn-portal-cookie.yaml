id: topsec-vpn-portal-cookie
info:
  name: topsec-vpn
  author: archer
  verified: false
  description: 检测到topsec-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: topsec.vpn
    name: 天融信 VPN
    vendor: 天融信
    category: security
    identity: product
    assurance: verified
    tags:
      - vpn
    aliases:
      - 天融信SSLVPN
      - 天融信下一代VPN
    references:
      - https://www.topsec.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.body.ibcontains(b"/portal_default/index.html") && response.raw_header.ibcontains(b"server: TopWebServer") && response.raw_header.ibcontains(b"set-cookie: topsecsvuilanguage")'
expression: r0()
