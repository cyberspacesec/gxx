id: apereo-cas-jasig
info:
  name: jasig-cas
  author: archer
  verified: false
  description: 检测到jasig-cas系统或组件的特征
  created: 2025/04/24
  product:
    id: apereo.cas
    name: Apereo CAS
    vendor: Apereo Foundation
    category: security
    identity: product
    assurance: verified
    tags:
      - sso
    aliases:
      - Jasig CAS
      - CAS
      - Central Authentication Service
      - jasig-cas
    references:
      - https://apereo.github.io/cas/
      - https://www.apereo.org/projects/cas
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"powered by <a href=\"http://www.jasig.org/cas")
expression: r0()
