id: logbase-log-audit
info:
  name: LogBase 日志综合审计系统
  author: archer
  verified: false
  description: 检测到LogBase 日志综合审计系统系统或组件的特征
  created: 2025/04/24
  product:
    id: logbase.log-audit
    name: LogBase 日志综合审计系统
    category: security
    identity: product
    assurance: inferred
    tags:
      - siem
    aliases:
      - LogBase日志综合审计系统
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"setHtmlFontSize") && response.body.ibcontains(b"static/css/app") && response.body.ibcontains(b"1366")
expression: r0()
