id: zeroshell
info:
  name: zeroshell-防火墙
  author: archer
  verified: false
  description: 检测到zeroshell-防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: zeroshell.zeroshell
    name: ZeroShell
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
      - router
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"zeroshell")
expression: r0()
