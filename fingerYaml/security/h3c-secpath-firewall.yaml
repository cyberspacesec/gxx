id: h3c-secpath-firewall
info:
  name: h3c-secpath防火墙
  author: archer
  verified: false
  description: 检测到h3c-secpath防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: h3c.secpath-firewall
    name: H3C SecPath 防火墙
    vendor: 新华三
    category: security
    identity: product
    assurance: inferred
    tags:
