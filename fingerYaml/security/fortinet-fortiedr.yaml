id: fortinet-fortiedr
info:
  name: fortinet-ensilo
  author: archer
  verified: false
  description: 检测到fortinet-ensilo系统或组件的特征
  created: 2025/04/24
  product:
    id: fortinet.fortiedr
    name: FortiEDR
    vendor: Fortinet
    category: security
    identity: product
    assurance: inferred
