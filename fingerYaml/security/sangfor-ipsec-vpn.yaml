id: sangfor-ipsec-vpn
info:
  name: sangfor-ipsec-vpn
  author: archer
  verified: false
  description: 检测到sangfor-ipsec-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: sangfor.ipsec-vpn
    name: 深信服 IPSec VPN
    vendor: 深信服
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
    references:
      - https://www.sangfor.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"sangfor-ipsec")
expression: r0()
