id: sophos-cyberoam-ssl-vpn
info:
  name: sophos-cyberoam-sslvpn
  author: archer
  verified: false
  description: 检测到sophos-cyberoam-sslvpn系统或组件的特征
  created: 2025/04/24
  product:
    id: sophos.cyberoam-ssl-vpn
    name: Cyberoam SSL VPN
    vendor: Sophos
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"sslvpnuserportalloginform") && response.body.ibcontains(b"cyberoam ssl vpn portal")
expression: r0()
