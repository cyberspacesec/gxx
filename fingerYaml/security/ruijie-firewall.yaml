id: ruijie-firewall
info:
  name: ruijie-防火墙
  author: archer
  verified: false
  description: 检测到ruijie-防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: ruijie.firewall
    name: 锐捷防火墙
    vendor: 锐捷网络
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
    references:
      - https://www.ruijie.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"ssl_index_next.html") && response.body.ibcontains(b"4008 111 000")
expression: r0()
