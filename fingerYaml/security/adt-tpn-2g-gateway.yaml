id: adt-tpn-2g-gateway
info:
  name: adt-tpn-2g网关
  author: archer
  verified: false
  description: 检测到adt-tpn-2g网关系统或组件的特征
  created: 2025/04/24
  product:
    id: adt.tpn-2g-gateway
    name: 安达通 TPN-2G 网关
    vendor: 安达通
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
      - login
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"tpn-2g") && response.body.ibcontains(b"src=\"./system/usbkey.js\"")
expression: r0()
