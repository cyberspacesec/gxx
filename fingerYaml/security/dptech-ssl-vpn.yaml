id: dptech-ssl-vpn
info:
  name: 迪普 SSL VPN
  author: archer
  verified: false
  description: 检测到迪普 SSL VPN系统或组件的特征
  created: 2025/04/24
  product:
    id: dptech.ssl-vpn
    name: 迪普 SSL VPN
    vendor: 迪普科技
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
    aliases:
      - 迪普SSLVPN
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/sslvpn/client/dpsslvpn.xpi")
expression: r0()
