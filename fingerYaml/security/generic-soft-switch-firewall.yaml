id: generic-soft-switch-firewall
info:
  name: 软交换防火墙
  author: archer
  verified: false
  description: 检测到软交换防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: generic.soft-switch-firewall
    name: 软交换防火墙
    category: security
    identity: signal
    assurance: inferred
    tags:
      - firewall
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"name=\"secretkey\" id=\"secretkey\"") && response.body.ibcontains(b"name=\"token_code\"placeholder=\"令牌口令\"")
expression: r0()
