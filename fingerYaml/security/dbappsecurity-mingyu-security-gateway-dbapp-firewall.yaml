id: dbappsecurity-mingyu-security-gateway-dbapp-firewall
info:
  name: 安恒信息-防火墙
  author: archer
  verified: false
  description: 检测到安恒信息-防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: dbappsecurity.mingyu-security-gateway
    name: 明御安全网关
    vendor: 安恒信息
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
      - gateway
    aliases:
      - 安恒防火墙
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"dbapp security") && response.body.ibcontains(b"scripts/web-common.js")
expression: r0()
