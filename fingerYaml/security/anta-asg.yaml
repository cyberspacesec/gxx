id: anta-asg
info:
  name: anta-asg
  author: archer
  verified: false
  description: 检测到anta-asg系统或组件的特征
  created: 2025/04/24
  product:
    id: anta.asg
    name: ANTA ASG
    category: security
    identity: product
    assurance: inferred
    tags:
      - gateway
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"setcookie(\"asglanguage\",document.form1.planguage.value)")
expression: r0()
