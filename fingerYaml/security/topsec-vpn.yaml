id: topsec-vpn
info:
  name: 天融信VPN
  author: archer
  verified: false
  description: 检测到天融信VPN系统或组件的特征
  created: 2025/04/24
  product:
    id: topsec.vpn
    name: 天融信 VPN
    vendor: 天融信
    category: security
    identity: product
    assurance: verified
    tags:
      - vpn
    aliases:
      - 天融信SSLVPN
      - 天融信下一代VPN
    references:
      - https://www.topsec.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: TopWebServer")'
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"window.location.href=\"/vone/pub/pda.html\";") && response.body.ibcontains(b"window.location=\"/portal_default/index.html\";</script>")
expression: r0() || r1()
