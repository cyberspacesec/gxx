id: topsec-firewall
info:
  name: 天融信防火墙
  author: archer
  verified: false
  description: 检测到天融信防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: topsec.firewall
    name: 天融信防火墙
    vendor: 天融信
    category: security
    identity: product
    assurance: verified
    tags:
      - firewall
    references:
      - https://www.topsec.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/home/index/getPowers/")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/cgi/maincgi.cgi?Url=VerifyCode")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"<TITLE>Web User Login</TITLE>") && response.body.ibcontains(b"loginCheck")
expression: r0() || r1() || r2()
