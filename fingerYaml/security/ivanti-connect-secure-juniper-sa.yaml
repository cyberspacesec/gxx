id: ivanti-connect-secure-juniper-sa
info:
  name: juniper-vpn
  author: archer
  verified: false
  description: 检测到juniper-vpn系统或组件的特征
  created: 2025/04/24
  product:
    id: ivanti.connect-secure
    name: Ivanti Connect Secure
    vendor: Ivanti
    category: security
    identity: product
    assurance: inferred
    tags:
      - vpn
    aliases:
      - juniper-vpn
      - Junos Pulse Secure Access Service
      - Pulse Connect Secure
      - Pulse Secure
      - Juniper SSL VPN
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"juniper networks vpn") && response.body.ibcontains(b"junos pulse secure access service")
expression: r0()
