id: ziguang-firewall
info:
  name: 紫光集团-紫光防火墙
  author: archer
  verified: false
  description: 检测到紫光集团-紫光防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: ziguang.firewall
    name: 紫光防火墙
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"紫光防火墙") && response.body.ibcontains(b"name=\"adminlogin\" action=\"/cgi-bin/manageaccount\">")
expression: r0()
