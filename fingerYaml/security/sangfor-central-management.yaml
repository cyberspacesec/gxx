id: sangfor-central-management
info:
  name: 深信服管理系统
  author: archer
  verified: false
  description: 检测到深信服管理系统系统或组件的特征
  created: 2025/04/24
  product:
    id: sangfor.central-management
    name: 深信服集中管理平台
    vendor: 深信服
    category: security
    identity: product
    assurance: inferred
    aliases:
      - 深信服管理系统
    references:
      - https://www.sangfor.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/cgi-bin/login.cgi?requestname=")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var msg = '对不起，集中管理平台暂不支持您当前使用的浏览器")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"var msg = '对不起, '+str+'暂不支持您当前使用的浏览器")
expression: r0() || r1() || r2()
