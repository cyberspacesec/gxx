id: qianxin-tianqing-skylar-cookie
info:
  name: 360新天擎
  author: archer
  verified: false
  description: 检测到360新天擎系统或组件的特征
  created: 2025/04/24
  product:
    id: qianxin.tianqing
    name: 奇安信天擎终端安全管理系统
    vendor: 奇安信
    category: security
    identity: product
    assurance: inferred
    tags:
      - endpoint
      - edr
    aliases:
      - 天擎终端安全管理系统
      - 360天擎
      - 奇安信天擎
      - 360新天擎
      - 天擎
      - 新天擎
    references:
      - https://www.qianxin.com/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.status == 302 && response.raw_header.ibcontains(b"Location: /login?refer=%2F") && response.raw_header.ibcontains(b"Set-Cookie: SKYLAR")'
expression: r0()
