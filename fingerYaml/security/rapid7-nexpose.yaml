id: rapid7-nexpose
info:
  name: nexpose-security-console
  author: archer
  verified: false
  description: 检测到nexpose-security-console系统或组件的特征
  created: 2025/04/24
  product:
    id: rapid7.nexpose
    name: Rapid7 Nexpose
    vendor: Rapid7
    category: security
    identity: product
    assurance: inferred
    tags:
      - vulnerability-scanner
    aliases:
      - Nexpose Security Console
      - InsightVM
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/nexpose-dark.min.css")
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"nexposeccpassword")
  r2:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"/nexpose-features.js")
expression: r0() || r1() || r2()
