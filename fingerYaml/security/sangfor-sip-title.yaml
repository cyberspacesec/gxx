id: sangfor-sip-title
info:
  name: 深信服安全感知平台
  author: archer
  verified: true
  description: 检测到深信服安全感知平台系统或组件的特征
  created: 2025/04/16
  product:
    id: sangfor.sip
    name: 深信服安全感知平台 SIP
    vendor: 深信服
    category: security
    identity: product
    assurance: verified
    tags:
      - siem
    aliases:
      - 深信服安全感知平台
    references:
      - https://www.sangfor.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.icon_hash == "-1389145411"
  r1:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"apps") && response.body.ibcontains(b"login.js") && response.body.ibcontains(b"安全感知平台")
expression: r0() || r1()
