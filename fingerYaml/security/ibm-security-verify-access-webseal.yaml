id: ibm-security-verify-access-webseal
info:
  name: ibm-webseal
  author: archer
  verified: false
  description: 检测到ibm-webseal系统或组件的特征
  created: 2025/04/24
  product:
    id: ibm.security-verify-access
    name: IBM Security Verify Access
    vendor: IBM
    category: security
    identity: product
    assurance: inferred
    tags:
      - sso
      - proxy
    aliases:
      - Tivoli Access Manager
      - WebSEAL
      - IBM Security Access Manager
rules:
  r0:
    request:
      method: GET
      path: /
    expression: 'response.raw_header.ibcontains(b"Server: webseal")'
expression: r0()
