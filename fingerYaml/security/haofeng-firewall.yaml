id: haofeng-firewall
info:
  name: 皓峰通讯-智能防火墙
  author: archer
  verified: false
  description: 检测到皓峰通讯-智能防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: haofeng.firewall
    name: 皓峰智能防火墙
    vendor: 皓峰通讯
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
    aliases:
      - 皓峰防火墙
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b" <body bgcolor=#ddeeff onload=\"document.all.user.focus()\">") && response.body.ibcontains(b"皓峰防火墙")
expression: r0()
