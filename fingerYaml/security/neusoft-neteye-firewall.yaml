id: neusoft-neteye-firewall
info:
  name: neusoft-neteye防火墙
  author: archer
  verified: false
  description: 检测到neusoft-neteye防火墙系统或组件的特征
  created: 2025/04/24
  product:
    id: neusoft.neteye-firewall
    name: NetEye 防火墙
    vendor: 东软
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
    aliases:
      - 东软 NetEye
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"name=\"login_form\" action=\"/fwm4/fwm.cgi/usrlgin\" ") && response.body.ibcontains(b"neteye防火墙系统")
expression: r0()
