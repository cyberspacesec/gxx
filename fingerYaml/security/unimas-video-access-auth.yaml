id: unimas-video-access-auth
info:
  name: 合众数据-视频安全接入用户认证系统
  author: archer
  verified: false
  description: 检测到合众数据-视频安全接入用户认证系统系统或组件的特征
  created: 2025/04/24
  product:
    id: unimas.video-access-auth
    name: 视频安全接入用户认证系统
    vendor: 合众数据
    category: security
    identity: product
    assurance: inferred
    tags:
      - camera
      - gateway
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"txtpasswordcssclass") && response.body.ibcontains(b"视频安全接入用户认证系统")
expression: r0()
