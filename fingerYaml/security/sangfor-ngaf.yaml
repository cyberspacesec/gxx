id: sangfor-ngaf
info:
  name: 深信服下一代防火墙-ngaf
  author: archer
  verified: false
  description: 检测到深信服下一代防火墙-ngaf系统或组件的特征
  created: 2025/04/24
  product:
    id: sangfor.ngaf
    name: 深信服下一代防火墙 NGAF
    vendor: 深信服
    category: security
    identity: product
    assurance: inferred
    tags:
      - firewall
    aliases:
      - 深信服防火墙
    references:
      - https://www.sangfor.com.cn/
rules:
  r0:
    request:
      method: GET
      path: /
    expression: response.body.ibcontains(b"NGAF") && response.body.ibcontains(b"SANGFOR") && response.body.ibcontains(b"login")
expression: r0()
